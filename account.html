<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Sign In — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Input, Button, Card, Checkbox, Select } = window.FunXDesignSystem_bbd8ae;

function ModeSwitch({ mode, setMode }){
  return <div style={{display:'flex',borderRadius:'var(--radius-md)',background:'var(--surface-panel)',border:'1px solid var(--border-hairline)',padding:4,marginBottom:32}}>
    {['sign-in','create'].map(m => <div key={m} onClick={()=>setMode(m)} style={{flex:1,textAlign:'center',padding:'10px 0',borderRadius:'var(--radius-sm)',cursor:'pointer',fontSize:14,fontWeight:600,background:mode===m?'var(--color-primary)':'transparent',color:mode===m?'#fff':'var(--text-secondary)',transition:'background var(--duration-fast)'}}>{m==='sign-in'?'Sign In':'Create Account'}</div>)}
  </div>;
}

function SignInForm({ onSuccess }){
  const [form,setForm] = React.useState({email:'',password:'',remember:true});
  const [error,setError] = React.useState('');
  const [pending,setPending] = React.useState(false);
  const update = (k) => (e) => setForm({...form,[k]: e.target.type==='checkbox' ? e.target.checked : e.target.value});

  const submit = (e) => {
    e.preventDefault();
    setError(''); setPending(true);
    // Read by common.jsx's storage adapter on the very next auth write —
    // must be set before signInWithPassword actually persists the token.
    localStorage.setItem('funx_remember_me', form.remember ? 'true' : 'false');
    window.supabaseClient.auth.signInWithPassword({ email: form.email, password: form.password }).then(({ error }) => {
      setPending(false);
      // Supabase's own "Invalid login credentials" is already generic by
      // design (doesn't say which of email/password was wrong) — shown as-is.
      if (error) { setError(error.message); return; }
      onSuccess();
    });
  };

  return <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20}}>
    <Input label="Email" type="email" placeholder="you@example.com" value={form.email} onChange={update('email')} required/>
    <Input label="Password" type="password" placeholder="••••••••" value={form.password} onChange={update('password')} required/>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:24,fontSize:13}}>
      <Checkbox label="Keep me signed in" checked={form.remember} onChange={update('remember')}/>
      <a href="forgot-password.html" style={{color:'var(--text-link)'}}>Forgot password?</a>
    </div>
    {error && <div style={{fontSize:13,color:'var(--color-error)'}}>{error}</div>}
    <Button variant="primary" size="lg" disabled={pending}>{pending ? 'Signing in…' : 'Sign In'}</Button>
  </form>;
}

function CreateForm({ onNeedsConfirmation }){
  const [form,setForm] = React.useState({name:'',email:'',password:'',confirm:'',country:'Pakistan'});
  const [error,setError] = React.useState('');
  const [pending,setPending] = React.useState(false);
  const update = (k) => (e) => setForm({...form,[k]:e.target.value});

  const submit = (e) => {
    e.preventDefault();
    setError('');
    if (form.password.length < 8) { setError('Password must be at least 8 characters.'); return; }
    if (form.password !== form.confirm) { setError("Passwords don't match."); return; }
    setPending(true);
    window.supabaseClient.auth.signUp({
      email: form.email,
      password: form.password,
      options: { data: { name: form.name, country: form.country } },
    }).then(({ data, error }) => {
      setPending(false);
      if (error) {
        setError(/already registered|already exists|user already/i.test(error.message)
          ? 'This email is already registered — try signing in instead.'
          : error.message);
        return;
      }
      // Projects with "Confirm email" turned off return an active session
      // immediately; otherwise data.session is null until the email link is clicked.
      if (data.session) { location.href = 'index.html'; return; }
      onNeedsConfirmation();
    });
  };

  return <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20}}>
    <Input label="Full name" placeholder="Jordan Rivera" value={form.name} onChange={update('name')} required/>
    <Input label="Email" type="email" placeholder="you@example.com" value={form.email} onChange={update('email')} required/>
    <Select label="Country" value={form.country} onChange={update('country')} options={window.COUNTRIES}/>
    <Input label="Password" type="password" placeholder="At least 8 characters" value={form.password} onChange={update('password')} required/>
    <Input label="Confirm password" type="password" placeholder="Re-enter your password" value={form.confirm} onChange={update('confirm')} required/>
    {error && <div style={{fontSize:13,color:'var(--color-error)'}}>{error}</div>}
    <Button variant="primary" size="lg" disabled={pending}>{pending ? 'Creating account…' : 'Create Account'}</Button>
    <p style={{fontSize:12,color:'var(--text-muted)',lineHeight:1.6,margin:0}}>By creating an account you agree to our Terms and Privacy Policy.</p>
  </form>;
}

function AuthCard(){
  const [mode,setMode] = React.useState('sign-in');
  const [signedUp,setSignedUp] = React.useState(false);
  return <Card variant="dark" padding="lg" style={{width:440,boxShadow:'var(--shadow-3)'}}>
    {signedUp ? <div style={{textAlign:'center',padding:'24px 8px'}}>
      <div style={{fontSize:40,marginBottom:16,color:'var(--color-success)'}}>✓</div>
      <h3 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:28,margin:'0 0 10px'}}>Check your email</h3>
      <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:24}}>We've sent a confirmation link to your inbox — verify your email, then sign in below.</p>
      <Button variant="secondary" size="md" onClick={()=>{setSignedUp(false);setMode('sign-in');}}>Back to Sign In</Button>
    </div> : <>
      <div style={{textAlign:'center',marginBottom:28}}>
        <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:12}}>Collector's Circle</div>
        <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:36,margin:0}}>{mode==='sign-in' ? 'Sign In' : 'Create Account'}</h1>
      </div>
      <ModeSwitch mode={mode} setMode={setMode}/>
      {mode==='sign-in' ? <SignInForm onSuccess={()=>{location.href='index.html';}}/> : <CreateForm onNeedsConfirmation={()=>setSignedUp(true)}/>}
    </>}
  </Card>;
}

function OrderHistory(){
  return <div>
    <h3 style={{fontSize:18,fontWeight:700,margin:'0 0 16px'}}>Order History</h3>
    <p style={{color:'var(--text-muted)',fontSize:14}}>No orders yet — once you place your first order, it'll show up here.</p>
  </div>;
}

function Dashboard({ session }){
  const [profile,setProfile] = React.useState(null);
  const [form,setForm] = React.useState(null);
  const [saving,setSaving] = React.useState(false);
  const [saved,setSaved] = React.useState(false);
  const [error,setError] = React.useState('');

  React.useEffect(() => {
    window.supabaseClient.from('profiles').select('*').eq('id', session.user.id).single().then(({ data }) => {
      setProfile(data);
      const addr = (data && data.shipping_address) || {};
      setForm({
        name: (data && data.name) || '',
        phone: (data && data.phone) || '',
        country: (data && data.country) || 'Pakistan',
        line1: addr.line1 || '', line2: addr.line2 || '', city: addr.city || '',
        region: addr.region || '', postal_code: addr.postal_code || '',
      });
    });
  }, [session.user.id]);

  const update = (k) => (e) => setForm({...form,[k]:e.target.value});

  const save = (e) => {
    e.preventDefault();
    setSaving(true); setError(''); setSaved(false);
    window.supabaseClient.from('profiles').update({
      name: form.name,
      phone: form.phone,
      country: form.country,
      shipping_address: { line1: form.line1, line2: form.line2, city: form.city, region: form.region, postal_code: form.postal_code, country: form.country },
    }).eq('id', session.user.id).then(({ error }) => {
      setSaving(false);
      if (error) { setError(error.message); return; }
      setSaved(true);
      setTimeout(()=>setSaved(false), 2500);
    });
  };

  if (!form) return <div style={{minHeight:'50vh'}}/>;

  return <section style={{maxWidth:860,margin:'0 auto',padding:'56px 40px 96px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,flexWrap:'wrap',gap:16}}>
      <div>
        <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:10}}>Collector's Circle</div>
        <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:36,margin:0}}>{form.name || session.user.email}</h1>
        <p style={{color:'var(--text-muted)',fontSize:13,marginTop:6}}>{session.user.email}{profile && ` · Member since ${new Date(profile.created_at).toLocaleDateString('en-US',{month:'long',year:'numeric'})}`}</p>
      </div>
      <Button variant="secondary" size="md" onClick={()=>window.supabaseClient.auth.signOut()}>Sign Out</Button>
    </div>

    <Card variant="dark" padding="lg" style={{marginTop:32}}>
      <h3 style={{fontSize:18,fontWeight:700,margin:'0 0 20px'}}>Profile</h3>
      <form onSubmit={save} style={{display:'flex',flexDirection:'column',gap:18}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
          <Input label="Full name" value={form.name} onChange={update('name')}/>
          <Input label="Phone" value={form.phone} onChange={update('phone')}/>
        </div>
        <Select label="Country" value={form.country} onChange={update('country')} options={window.COUNTRIES}/>
        <div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:10,color:'var(--text-secondary)'}}>Shipping Address</div>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <Input label="Address line 1" value={form.line1} onChange={update('line1')}/>
            <Input label="Address line 2 (optional)" value={form.line2} onChange={update('line2')}/>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
              <Input label="City" value={form.city} onChange={update('city')}/>
              <Input label="State / Region" value={form.region} onChange={update('region')}/>
              <Input label="Postal code" value={form.postal_code} onChange={update('postal_code')}/>
            </div>
          </div>
        </div>
        {error && <div style={{fontSize:13,color:'var(--color-error)'}}>{error}</div>}
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <Button variant="primary" size="md" disabled={saving}>{saving ? 'Saving…' : 'Save Changes'}</Button>
          {saved && <span style={{fontSize:13,color:'var(--color-success)'}}>Saved ✓</span>}
        </div>
      </form>
    </Card>

    <Card variant="dark" padding="lg" style={{marginTop:24}}>
      <OrderHistory/>
    </Card>
  </section>;
}

function App(){
  const session = window.useSession();
  return <div>
    <Header active=""/>
    {session === undefined ? <div style={{minHeight:'60vh'}}/>
      : session === null ? <section style={{minHeight:'calc(100vh - 156px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'64px 40px',background:'var(--surface-sunken)'}} data-screen-label="Login / Register"><AuthCard/></section>
      : <Dashboard session={session}/>}
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
