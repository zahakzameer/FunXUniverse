<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Sign In — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Input, Button, Card, Checkbox } = window.FunXDesignSystem_bbd8ae;

function ModeSwitch({ mode, setMode }){
  return <div style={{display:'flex',borderRadius:'var(--radius-md)',background:'var(--surface-panel)',border:'1px solid var(--border-hairline)',padding:4,marginBottom:32}}>
    {['sign-in','create'].map(m => <div key={m} onClick={()=>setMode(m)} style={{flex:1,textAlign:'center',padding:'10px 0',borderRadius:'var(--radius-sm)',cursor:'pointer',fontSize:14,fontWeight:600,background:mode===m?'var(--color-primary)':'transparent',color:mode===m?'#fff':'var(--text-secondary)',transition:'background var(--duration-fast)'}}>{m==='sign-in'?'Sign In':'Create Account'}</div>)}
  </div>;
}

function SignInForm({ done }){
  const [form,setForm] = React.useState({email:'',password:''});
  const update = (k) => (e) => setForm({...form,[k]:e.target.value});
  return <form onSubmit={(e)=>{e.preventDefault();done();}} style={{display:'flex',flexDirection:'column',gap:20}}>
    <Input label="Email" type="email" placeholder="you@example.com" value={form.email} onChange={update('email')} required/>
    <Input label="Password" type="password" placeholder="••••••••" value={form.password} onChange={update('password')} required/>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:24,fontSize:13}}>
      <Checkbox label="Keep me signed in"/>
      <a href="forgot-password.html" style={{color:'var(--text-link)'}}>Forgot password?</a>
    </div>
    <Button variant="primary" size="lg">Sign In</Button>
  </form>;
}

function CreateForm({ done }){
  const [form,setForm] = React.useState({name:'',email:'',password:''});
  const update = (k) => (e) => setForm({...form,[k]:e.target.value});
  return <form onSubmit={(e)=>{e.preventDefault();done();}} style={{display:'flex',flexDirection:'column',gap:20}}>
    <Input label="Full name" placeholder="Jordan Rivera" value={form.name} onChange={update('name')} required/>
    <Input label="Email" type="email" placeholder="you@example.com" value={form.email} onChange={update('email')} required/>
    <Input label="Password" type="password" placeholder="At least 8 characters" value={form.password} onChange={update('password')} required/>
    <Checkbox label="Send me early access to numbered drops"/>
    <Button variant="primary" size="lg">Create Account</Button>
    <p style={{fontSize:12,color:'var(--text-muted)',lineHeight:1.6,margin:0}}>By creating an account you agree to our Terms and Privacy Policy.</p>
  </form>;
}

function App(){
  const [mode,setMode] = React.useState('sign-in');
  const [done,setDone] = React.useState(false);

  return <div>
    <Header active=""/>
    <section style={{minHeight:'calc(100vh - 156px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'64px 40px',background:'var(--surface-sunken)'}} data-screen-label="Login / Register">
      <Card variant="dark" padding="lg" style={{width:440,boxShadow:'var(--shadow-3)'}}>
        {done ? <div style={{textAlign:'center',padding:'24px 8px'}}>
          <div style={{fontSize:40,marginBottom:16,color:'var(--color-success)'}}>✓</div>
          <h3 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:28,margin:'0 0 10px'}}>{mode==='sign-in'?'Welcome back':'Account created'}</h3>
          <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:24}}>{mode==='sign-in' ? "You're signed in to the Collector's Circle." : 'Check your email to confirm your new account.'}</p>
          <Button variant="secondary" size="md" onClick={()=>location.href='index.html'}>Continue Shopping</Button>
        </div> : <>
          <div style={{textAlign:'center',marginBottom:28}}>
            <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:12}}>Collector's Circle</div>
            <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:36,margin:0}}>{mode==='sign-in' ? 'Sign In' : 'Create Account'}</h1>
          </div>
          <ModeSwitch mode={mode} setMode={setMode}/>
          {mode==='sign-in' ? <SignInForm done={()=>setDone(true)}/> : <CreateForm done={()=>setDone(true)}/>}
        </>}
      </Card>
    </section>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
<script src="motion.js"></script>
</body></html>
