<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Authentication — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Breadcrumb, Input, Button } = window.FunXDesignSystem_bbd8ae;

function App(){
  const [order,setOrder] = React.useState('');
  const [result,setResult] = React.useState(null);
  const submit = (e) => { e.preventDefault(); setResult(order.length > 2); };
  return <div>
    <Header active=""/>
    <div style={{maxWidth:900,margin:'0 auto',padding:'40px 40px 0'}} data-screen-label="Authentication"><Breadcrumb items={['The Universe','Authentication']}/></div>
    <section style={{maxWidth:900,margin:'0 auto',padding:'24px 40px 0',textAlign:'center'}}>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:52,margin:'0 0 14px'}}>Authentication</h1>
      <p style={{color:'var(--text-secondary)',fontSize:16,maxWidth:560,margin:'0 auto'}}>Every FunX order is logged and traceable. Look yours up below to confirm it's a genuine FunX shipment.</p>
    </section>

    <section style={{maxWidth:520,margin:'0 auto',padding:'56px 40px 0'}}>
      <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20,border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,background:'var(--surface-panel)'}}>
        <Input label="Order number" placeholder="e.g. FX-10482" value={order} onChange={e=>setOrder(e.target.value)}/>
        <Button variant="primary" size="lg">Verify</Button>
        {result === true && <div style={{fontSize:13,color:'var(--color-success)'}}>✓ Verified — this order is logged in our system.</div>}
        {result === false && <div style={{fontSize:13,color:'var(--color-error)'}}>Enter a valid order number to verify.</div>}
      </form>
    </section>

    <section style={{maxWidth:900,margin:'0 auto',padding:'80px 40px 96px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24}}>
      {[['Order Logging','Every order placed on FunX gets a unique order number tied to your shipment, from checkout to delivery.'],['Sample Testing','New products are sample-tested by the FunX team before launch — we don\u2019t list anything we haven\u2019t personally checked.'],['Direct Support','Questions about an order or a product? You\u2019re talking to the same small team building the catalog, not a call center script.']].map(([t,d]) => <div key={t}>
        <div style={{fontSize:16,fontWeight:600,marginBottom:10}}>{t}</div>
        <div style={{fontSize:14,color:'var(--text-muted)',lineHeight:1.7}}>{d}</div>
      </div>)}
    </section>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body></html>
