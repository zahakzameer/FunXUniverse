<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="How The FunX Universe guarantees the authenticity of every toy we sell.">

<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Breadcrumb, Input, Button } = window.FunXDesignSystem_bbd8ae;

function App(){
  const [order,setOrder] = React.useState('');
  const [result,setResult] = React.useState(null);
  const [checking,setChecking] = React.useState(false);
  const submit = (e) => {
    e.preventDefault();
    setChecking(true);
    setResult(null);
    window.supabaseClient.rpc('order_exists', { p_order_number: order.trim() }).then(({ data, error }) => {
      setChecking(false);
      setResult(error ? 'unavailable' : !!data);
    });
  };
  return <div>
    <Header active=""/>
    <div style={{maxWidth:900,margin:'0 auto',padding:'40px 40px 0'}} data-screen-label="Authentication"><Breadcrumb items={['The Universe','Authentication']}/></div>
    <section style={{maxWidth:900,margin:'0 auto',padding:'24px 40px 0',textAlign:'center'}}>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:52,margin:'0 0 14px'}}>Authentication</h1>
      <p style={{color:'var(--text-secondary)',fontSize:16,maxWidth:560,margin:'0 auto'}}>Every FunX order is logged and traceable. Look yours up below to confirm it's a genuine FunX shipment.</p>
    </section>

    <section style={{maxWidth:520,margin:'0 auto',padding:'56px 40px 0'}}>
      <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20,border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,background:'var(--surface-panel)'}}>
        <Input label="Order number" placeholder="e.g. FX-10482" value={order} onChange={e=>setOrder(e.target.value)}/>
        <Button variant="primary" size="lg" disabled={checking}>{checking ? 'Checking…' : 'Verify'}</Button>
        {result === true && <div style={{fontSize:13,color:'var(--color-success)'}}>✓ Verified — this order is logged in our system.</div>}
        {result === false && <div style={{fontSize:13,color:'var(--color-error)'}}>We couldn't find that order number — double-check it and try again.</div>}
        {result === 'unavailable' && <div style={{fontSize:13,color:'var(--text-muted)'}}>Verification isn't available right now — please try again shortly.</div>}
      </form>
    </section>

    <section style={{maxWidth:900,margin:'0 auto',padding:'80px 40px 96px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24}}>
      {[['Order Logging','Every order placed on FunX gets a unique order number tied to your shipment, from checkout to delivery.'],['Sample Testing','New products are sample-tested by the FunX team before launch — we don\u2019t list anything we haven\u2019t personally checked.'],['Direct Support','Questions about an order or a product? You\u2019re talking to the same small team building the catalog, not a call center script.']].map(([t,d]) => <div key={t}>
        <div style={{fontSize:16,fontWeight:600,marginBottom:10}}>{t}</div>
        <div style={{fontSize:14,color:'var(--text-muted)',lineHeight:1.7}}>{d}</div>
      </div>)}
    </section>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
