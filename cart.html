<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Collection — The FunX Universe</title>
<meta name="description" content="Review your cart at The FunX Universe before checkout.">
<link rel="canonical" href="https://funxuniverse.com/cart.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The FunX Universe">
<meta property="og:title" content="Your Collection — The FunX Universe">
<meta property="og:description" content="Review your cart at The FunX Universe before checkout.">
<meta property="og:url" content="https://funxuniverse.com/cart.html">
<meta property="og:image" content="https://funxuniverse.com/assets/hero-universe.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your Collection — The FunX Universe">
<meta name="twitter:description" content="Review your cart at The FunX Universe before checkout.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Button, Input } = window.FunXDesignSystem_bbd8ae;

// `max` was missing entirely — the + button had no ceiling, no stock
// check, nothing. A customer (or an impatient double-click, or a stuck
// key) could run qty up indefinitely; product.html's own QtyStepper
// already caps at real stock, this one just never did.
function QtyStepper({ qty, setQty, max }){
  const atMax = max != null && qty >= max;
  return <div style={{display:'flex',alignItems:'center',border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-sm)',width:104,height:36}}>
    <button onClick={()=>setQty(Math.max(1,qty-1))} style={{flex:1,height:'100%',background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',fontSize:16}}>−</button>
    <span style={{flex:1,textAlign:'center',fontSize:14}}>{qty}</span>
    <button onClick={()=>setQty(max!=null ? Math.min(max,qty+1) : qty+1)} disabled={atMax} style={{flex:1,height:'100%',background:'none',border:'none',color: atMax ? 'var(--text-muted)' : 'var(--text-secondary)',cursor: atMax ? 'not-allowed' : 'pointer',fontSize:16}}>+</button>
  </div>;
}

function CartRow({ item, onQty, onRemove }){
  const p = item.p;
  return <div style={{display:'grid',gridTemplateColumns:'110px 1fr auto auto',alignItems:'center',gap:24,padding:'24px 0',borderBottom:'1px solid var(--border-hairline-soft)'}}>
    <div style={{width:110,height:110,borderRadius:'var(--radius-md)',overflow:'hidden',background:'var(--surface-gallery)',color:'var(--text-ink)',border:'1px solid var(--border-gallery)'}}>
      {p.images && p.images[0] ? <img src={p.images[0]} alt={p.name} loading="lazy" decoding="async" style={{width:'100%',height:'100%',objectFit:'cover'}}/> : <image-slot id={`cart-${p.id}`} style={{width:'100%',height:'100%'}} placeholder={`Photo of ${p.name}`}></image-slot>}
    </div>
    <div>
      <div style={{fontSize:11,color:'var(--text-muted)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{p.line || p.category}</div>
      <div style={{fontSize:17,fontWeight:600,marginBottom:10}}>{window.titleCase(p.name)}</div>
      <QtyStepper qty={item.qty} setQty={(q)=>onQty(p.id,q)} max={Math.max(1,p.quantity)}/>
    </div>
    <div style={{fontSize:16,fontWeight:700,color:'var(--paint-orange)',justifySelf:'end'}}>{window.fmtPrice((p.salePrice||p.price)*item.qty)}</div>
    <button onClick={()=>onRemove(p.id)} style={{cursor:'pointer',color:'var(--text-muted)',width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'50%',background:'none',border:'none'}} title="Remove" aria-label={`Remove ${p.name} from cart`}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>;
}

function App(){
  const [items,setItemsRaw] = React.useState(()=>window.getCart());
  const setItems = (updater) => {
    setItemsRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      window.saveCart(next);
      return next;
    });
  };
  React.useEffect(()=>{
    const sync = () => setItemsRaw(window.getCart());
    window.addEventListener('funx-cart-updated', sync);
    window.addEventListener('storage', sync);
    return () => { window.removeEventListener('funx-cart-updated', sync); window.removeEventListener('storage', sync); };
  },[]);
  const [promo,setPromo] = React.useState('');
  const [promoMsg,setPromoMsg] = React.useState('');
  const cart = items.map(i => ({...i, p: window.PRODUCTS.find(p=>p.id===i.id)})).filter(i=>i.p);

  // Repair any quantity already stuck above real stock from before the
  // stepper had a ceiling (e.g. a runaway click leaving qty:65536 in
  // localStorage) — clamp it down and persist so it doesn't linger.
  React.useEffect(()=>{
    const fixed = items.map(i => {
      const p = window.PRODUCTS.find(p=>p.id===i.id);
      const cap = p ? Math.max(1,p.quantity) : i.qty;
      return i.qty > cap ? {...i,qty:cap} : i;
    });
    if (fixed.some((f,idx)=>f.qty!==items[idx].qty)) setItems(fixed);
  },[items]);
  const subtotal = cart.reduce((s,i)=>s+(i.p.salePrice||i.p.price)*i.qty,0);
  const total = subtotal;

  const setQty = (id,q) => setItems(v => v.map(i => i.id===id ? {...i,qty:q} : i));
  const remove = (id) => setItems(v => v.filter(i => i.id!==id));

  return <div>
    <Header active=""/>
    <div id="main-content" tabIndex={-1} style={{outline:'none'}}></div>
    <section style={{maxWidth:1100,margin:'0 auto',padding:'56px 40px 0'}} data-screen-label="Cart">
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:44,margin:'0 0 8px'}}>Your Collection</h1>
      <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:40}}>{cart.length} item{cart.length===1?'':'s'} in your cart</p>
    </section>

    {cart.length === 0 ? <section style={{maxWidth:1100,margin:'0 auto',padding:'0 40px 120px',textAlign:'center'}}>
      <p style={{color:'var(--text-muted)',fontSize:15,marginBottom:24}}>Your collection is empty — start with a numbered edition or a new arrival.</p>
      <Button variant="primary" size="lg" onClick={()=>location.href='shop-all.html'}>Browse All Products</Button>
    </section> : <section style={{maxWidth:1100,margin:'0 auto',padding:'0 40px 120px',display:'grid',gridTemplateColumns:'1.6fr 1fr',gap:56,alignItems:'start'}}>
      <div>{cart.map(item => <CartRow key={item.id} item={item} onQty={setQty} onRemove={remove}/>)}</div>
      <div style={{border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,background:'var(--surface-panel)'}}>
        <h3 style={{fontSize:18,fontWeight:600,margin:'0 0 20px'}}>Order Summary</h3>
        <div style={{display:'flex',gap:10,marginBottom:20}}>
          <input value={promo} onChange={e=>setPromo(e.target.value)} placeholder="Promo code" style={{flex:1,height:44,borderRadius:'var(--radius-md)',border:'1px solid var(--border-hairline)',background:'var(--surface-card)',color:'var(--text-primary)',padding:'0 14px',fontSize:14,outline:'none'}}/>
          <Button variant="secondary" size="md" onClick={()=>setPromoMsg(promo.trim().length>0 ? 'No active promo codes right now.' : 'Enter a code first.')}>Apply</Button>
        </div>
        {promoMsg && <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>{promoMsg}</div>}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,color:'var(--text-secondary)',marginBottom:12}}><span>Subtotal</span><span>{window.fmtPrice(subtotal)}</span></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,color:'var(--text-secondary)',marginBottom:12}}><span>Shipping</span><span style={{color:'var(--text-muted)'}}>Calculated at checkout</span></div>
        <div style={{borderTop:'1px solid var(--border-hairline)',margin:'16px 0',paddingTop:16,display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:17}}><span>Total</span><span>{window.fmtPrice(total)}</span></div>
        <Button variant="primary" size="lg" onClick={()=>location.href='checkout.html'} style={{width:'100%'}}>Checkout</Button>
      </div>
    </section>}
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
