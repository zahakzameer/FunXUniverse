<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collectibles — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Breadcrumb, Select } = window.FunXDesignSystem_bbd8ae;

function PageHeader(){
  return <div style={{maxWidth:1280,margin:'0 auto',padding:'56px 40px 40px',textAlign:'center'}} data-screen-label="Collectibles">
    <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:56,margin:'0 0 14px'}}>Collectibles</h1>
    <p style={{color:'var(--text-secondary)',fontSize:17,maxWidth:560,margin:'0 auto'}}>Numbered runs, anniversary castings, and display-case pieces — each shipped with a certificate of provenance.</p>
  </div>;
}

// There's no dedicated edition-type field on products, so this matches
// against name/line text — a heuristic, not a canonical category. A real
// edition_type column on the product would be the cleaner long-term fix.
const EDITION_MATCHERS = {
  'Anniversary': p => /anniversary/i.test(p.name+' '+p.line),
  'Founders Set': p => /founders/i.test(p.name+' '+p.line),
  'Display Case': p => /display/i.test(p.name+' '+p.line),
  'Numbered': p => !/anniversary|founders|display/i.test(p.name+' '+p.line) && (p.badge==='Limited Edition' || p.badge==='Exclusive'),
};
const PRICE_MATCHERS = {
  'Under PKR 4,000': p => (p.salePrice||p.price) < 4000,
  'PKR 4,000–5,500': p => (p.salePrice||p.price) >= 4000 && (p.salePrice||p.price) < 5500,
  'PKR 5,500+': p => (p.salePrice||p.price) >= 5500,
};

function useFilters(groupTitles){
  const [filters,setFilters] = React.useState(() => Object.fromEntries(groupTitles.map(t=>[t,[]])));
  const toggle = (title,option) => setFilters(f => ({...f, [title]: f[title].includes(option) ? f[title].filter(x=>x!==option) : [...f[title], option]}));
  const clear = () => setFilters(Object.fromEntries(groupTitles.map(t=>[t,[]])));
  return { filters, toggle, clear };
}

function App(){
  const [sort,setSort] = React.useState('Featured');
  const [visible,setVisible] = React.useState(12);
  const { filters, toggle, clear } = useFilters(['Edition Type','Universe','Price']);

  let list = window.PRODUCTS.filter(p=>p.isCollectible);
  if (filters['Edition Type'].length) list = list.filter(p => filters['Edition Type'].some(o => EDITION_MATCHERS[o](p)));
  if (filters.Universe.length) list = list.filter(p => filters.Universe.includes(p.universe));
  if (filters.Price.length) list = list.filter(p => filters.Price.some(o => PRICE_MATCHERS[o](p)));

  if(sort==='Price: Low to High') list = [...list].sort((a,b)=>(a.salePrice||a.price)-(b.salePrice||b.price));
  if(sort==='Price: High to Low') list = [...list].sort((a,b)=>(b.salePrice||b.price)-(a.salePrice||a.price));

  const groups = [
    {title:'Edition Type', options:['Numbered','Anniversary','Founders Set','Display Case'], selected:filters['Edition Type'], onToggle:(o)=>toggle('Edition Type',o)},
    {title:'Universe', options:['Skyline Riders','Ironclad Legion','Aerodrome','Voltage Corps'], selected:filters.Universe, onToggle:(o)=>toggle('Universe',o)},
    {title:'Price', options:['Under PKR 4,000','PKR 4,000–5,500','PKR 5,500+'], selected:filters.Price, onToggle:(o)=>toggle('Price',o)},
  ];

  return <div>
    <Header active="Collectibles"/>
    <PageHeader/>
    <CategoryRail tiles={[
      {label:'Numbered Editions',href:'#grid'},
      {label:'Anniversary Castings',href:'#grid'},
      {label:'Founders Sets',href:'#grid'},
      {label:'Display Cases',href:'#grid'},
    ]}/>
    <section id="grid" style={{maxWidth:1280,margin:'0 auto',padding:'80px 40px 0',display:'flex',gap:48}}>
      <FilterSidebar groups={groups} onClear={clear}/>
      <div style={{flex:1}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:28,flexWrap:'wrap',gap:16}}>
          <div><Breadcrumb items={['Shop','Collectibles']}/><div style={{fontSize:13,color:'var(--text-muted)',marginTop:8}}>{list.length} products</div></div>
          <div style={{width:220}}><Select value={sort} onChange={e=>setSort(e.target.value)} options={['Featured','Price: Low to High','Price: High to Low']}/></div>
        </div>
        <ProductGrid products={list.slice(0,visible)} cols={4}/>
        {visible < list.length && <div style={{textAlign:'center',marginTop:48}}>
          <button onClick={()=>setVisible(v=>v+12)} style={{height:52,padding:'0 40px',borderRadius:'var(--radius-md)',border:'none',background:'var(--color-primary)',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>Load More</button>
        </div>}
      </div>
    </section>
    <div style={{height:96}}></div>
    <PromoBanner title="Every Piece, Numbered & Certified" sub="Provenance paperwork ships in the box — no exceptions." cta="Read the Story" ctaHref="provenance.html"/>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
