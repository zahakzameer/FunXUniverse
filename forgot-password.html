<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Reset Password — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Input, Button, Card } = window.FunXDesignSystem_bbd8ae;

function App(){
  const [email,setEmail] = React.useState('');
  const [sent,setSent] = React.useState(false);
  return <div>
    <Header active=""/>
    <section style={{minHeight:'calc(100vh - 156px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'64px 40px',background:'var(--surface-sunken)'}} data-screen-label="Forgot Password">
      <Card variant="dark" padding="lg" style={{width:420}}>
        {sent ? <div style={{textAlign:'center',padding:'12px 0'}}>
          <div style={{fontSize:36,marginBottom:14,color:'var(--color-success)'}}>✓</div>
          <h3 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:26,margin:'0 0 10px'}}>Check your email</h3>
          <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:24}}>If an account exists for {email || 'that address'}, a reset link is on its way.</p>
          <a href="account.html" style={{fontSize:13}}>Back to Sign In</a>
        </div> : <>
          <div style={{textAlign:'center',marginBottom:24}}>
            <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:12}}>Collector's Circle</div>
            <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:32,margin:'0 0 10px'}}>Reset Password</h1>
            <p style={{color:'var(--text-muted)',fontSize:14}}>Enter your email and we'll send a link to reset your password.</p>
          </div>
          <form onSubmit={(e)=>{e.preventDefault();setSent(true);}} style={{display:'flex',flexDirection:'column',gap:20}}>
            <Input label="Email" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required/>
            <Button variant="primary" size="lg">Send Reset Link</Button>
            <a href="account.html" style={{fontSize:13,textAlign:'center'}}>Back to Sign In</a>
          </form>
        </>}
      </Card>
    </section>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
<script src="motion.js"></script>
</body></html>
