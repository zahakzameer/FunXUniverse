<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
</div></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Button } = window.FunXDesignSystem_bbd8ae;

function Hero(){
  const headlineRef = React.useRef(null);
  const restRef = React.useRef(null);
  React.useEffect(() => {
    if (!window.gsap) return;
    const words = headlineRef.current ? headlineRef.current.querySelectorAll('.funx-hero-word') : [];
    const tl = window.gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.fromTo(words, { yPercent: 130, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.9, stagger: 0.09 })
      .fromTo(restRef.current, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, '-=0.35');
  }, []);

  return <section style={{position:'relative',minHeight:680,display:'flex',alignItems:'center',overflow:'hidden',background:'#000'}} data-screen-label="Home — Hero">
    <img src="assets/hero-universe.jpg" alt="The FunX Universe" fetchpriority="high" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',objectPosition:'center 40%',opacity:0.85}}/>
    <div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,rgba(11,11,13,0.95) 0%,rgba(11,11,13,0.6) 50%,rgba(11,11,13,0.25) 100%)'}}></div>
    <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(115deg,transparent 0,transparent 38px,rgba(255,255,255,0.03) 38px,rgba(255,255,255,0.03) 40px)',mixBlendMode:'overlay'}}></div>
    <div id="funx-hero-portal" style={{position:'absolute',inset:0,pointerEvents:'none'}}></div>
    <div style={{position:'absolute',top:0,bottom:0,right:0,width:6,background:'linear-gradient(180deg,var(--paint-orange),var(--paint-yellow))'}}></div>
    <div style={{position:'relative',maxWidth:1280,margin:'0 auto',padding:'0 40px',width:'100%'}}>
      <div style={{maxWidth:560}}>
        <div style={{display:'inline-flex',alignItems:'center',gap:8,fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:18}}>
          <span style={{width:8,height:8,borderRadius:'50%',background:'var(--paint-orange)',boxShadow:'0 0 10px var(--paint-orange)'}}></span>The FunX Universe
        </div>
        <h1 ref={headlineRef} style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:80,lineHeight:0.98,letterSpacing:'-1px',margin:'0 0 26px',overflow:'hidden'}}>
          <span style={{display:'block',overflow:'hidden'}}><span className="funx-hero-word" style={{display:'inline-block'}}>Every</span> <span className="funx-hero-word" style={{display:'inline-block'}}>Toy</span></span>
          <span style={{display:'block',overflow:'hidden'}}><span className="funx-hero-word" style={{display:'inline-block'}}>Has</span> <span className="funx-hero-word" style={{display:'inline-block'}}>a</span> <span className="funx-hero-word" style={{display:'inline-block'}}>Story</span></span>
        </h1>
        <div ref={restRef}>
          <p style={{fontSize:18,color:'var(--text-secondary)',lineHeight:1.6,marginBottom:36,maxWidth:440}}>Founded 2026 by a lifelong player, FunX builds RC vehicles, die-cast, and action figures worth taking out of the box — not just displaying.</p>
          <div style={{display:'flex',gap:14}}>
            <Button variant="primary" size="lg" onClick={()=>location.href='shop-all.html'}>Shop All Products</Button>
            <Button variant="secondary" size="lg" onClick={()=>location.href='shop-all.html?category=Action%20Figures'}>Shop Action Figures</Button>
          </div>
        </div>
      </div>
    </div>
  </section>;
}

const HERO_CATEGORIES = [
  {label:'Die-Cast Vehicles',href:'shop-all.html?category=Die-Cast%20Vehicles',copy:'Scale models built for the shelf and the racetrack alike.'},
  {label:'Action Figures',href:'shop-all.html?category=Action%20Figures',copy:'Characters worth posing, collecting, and actually playing with.'},
  {label:'Building Blocks',href:'shop-all.html?category=Building%20Blocks',copy:'Sets that reward patience with something worth keeping.'},
  {label:'Remote Control Vehicles',href:'shop-all.html?category=Remote%20Control%20Vehicles',copy:'Built for backyards, hallways, and everything in between.'},
];

function CategoryNav(){
  const wrapRef = React.useRef(null);
  const panelsRef = React.useRef([]);
  const isMobile = window.useIsMobile();

  React.useEffect(() => {
    if (isMobile || !window.gsap || !window.ScrollTrigger) return;
    window.gsap.registerPlugin(window.ScrollTrigger);
    const panels = panelsRef.current.filter(Boolean);
    if (panels.length === 0) return;
    window.gsap.set(panels, { autoAlpha: 0 });
    window.gsap.set(panels[0], { autoAlpha: 1 });

    const ctx = window.gsap.context(() => {
      const tl = window.gsap.timeline({
        scrollTrigger: {
          trigger: wrapRef.current,
          start: 'top top',
          end: () => '+=' + (panels.length * 640),
          scrub: 0.6,
          pin: true,
        },
      });
      panels.forEach((p, i) => {
        if (i === 0) return;
        tl.to(panels[i-1], { autoAlpha: 0, duration: 0.3 })
          .fromTo(p, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, '<');
      });
    }, wrapRef);
    return () => ctx.revert();
  }, [isMobile]);

  if (isMobile) {
    return <section style={{padding:'88px 0'}}>
      <div style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 40px'}}>
        <SectionHeading eyebrow="Start Browsing" title="Shop by Category"/>
      </div>
      <CategoryRail tiles={HERO_CATEGORIES}/>
    </section>;
  }

  return <section ref={wrapRef} style={{position:'relative',height:'100vh',overflow:'hidden',background:'var(--surface-canvas)'}}>
    {HERO_CATEGORIES.map((c,i) => <a key={c.label} href={c.href} ref={el=>panelsRef.current[i]=el}
      style={{position:'absolute',inset:0,display:'flex',alignItems:'center',textDecoration:'none',color:'inherit'}}>
      <div style={{position:'absolute',inset:0}}>
        <image-slot id={`hero-cat-${c.label}`} style={{width:'100%',height:'100%'}} placeholder={`Photo — ${c.label}`}></image-slot>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,rgba(11,11,13,0.9) 0%,rgba(11,11,13,0.4) 55%,transparent 100%)'}}></div>
      </div>
      <div style={{position:'relative',maxWidth:1280,margin:'0 auto',padding:'0 40px',width:'100%'}}>
        <div style={{maxWidth:520}}>
          <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--paint-orange)',textTransform:'uppercase',marginBottom:14}}>{`0${i+1} — Start Browsing`}</div>
          <h2 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:56,margin:'0 0 16px',letterSpacing:'-0.5px',color:'var(--text-primary)'}}>{c.label}</h2>
          <p style={{fontSize:16,color:'var(--text-secondary)',marginBottom:24,maxWidth:400}}>{c.copy}</p>
          <span style={{fontSize:14,fontWeight:700,color:'var(--paint-orange)'}}>Shop the collection →</span>
        </div>
      </div>
    </a>)}
    <div style={{position:'absolute',bottom:32,left:'50%',transform:'translateX(-50%)',display:'flex',gap:8}}>
      {HERO_CATEGORIES.map((c,i) => <span key={c.label} style={{width:24,height:3,borderRadius:2,background:'var(--border-strong)'}}></span>)}
    </div>
  </section>;
}

function FeaturedGrid(){
  const featured = window.PRODUCTS.slice(0,6);
  return <section style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px'}}>
    <SectionHeading eyebrow="The Collection" title="Shop the Catalog" cta="View all" ctaHref="shop-all.html"/>
    <ProductGrid products={featured} cols={3}/>
  </section>;
}

function TrustStrip(){
  const items = [['🚚','Free Shipping','On orders over Rs. 5,000'],['🛡️','Safe & Secure','100% secure payments'],['⭐','Premium Quality','Toys you can trust'],['↩️','Easy Returns','Hassle free returns'],['🏆','FunX Rewards','Earn while you play']];
  return <section style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:24,borderTop:'1px solid var(--border-hairline-soft)',borderBottom:'1px solid var(--border-hairline-soft)',padding:'32px 0'}}>
      {items.map(([icon,t,s]) => <div key={t} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,textAlign:'center'}}>
        <span style={{fontSize:28}}>{icon}</span>
        <div style={{fontSize:14,fontWeight:600}}>{t}</div>
        <div style={{fontSize:12,color:'var(--text-muted)'}}>{s}</div>
      </div>)}
    </div>
  </section>;
}

function StoryAndExplorer(){
  return <section style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:32}}>
    <div style={{position:'relative',borderRadius:'var(--radius-2xl)',overflow:'hidden',minHeight:280,background:'linear-gradient(135deg,#7C4DFF33,#F16A3E33)',border:'1px solid var(--border-hairline)',padding:40,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <image-slot id="story-cta-art" style={{position:'absolute',inset:0}} placeholder="Photo — child unboxing a FunX toy at night"></image-slot>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(0deg,rgba(11,11,13,0.85),rgba(11,11,13,0.15))'}}></div>
      <div style={{position:'relative'}}>
        <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--paint-yellow)',textTransform:'uppercase',marginBottom:10}}>Every Toy Has a Story</div>
        <p style={{fontSize:15,color:'var(--text-secondary)',marginBottom:20,maxWidth:340}}>Discover the stories behind your favorite toys and the adventures they come from.</p>
        <Button variant="primary" size="md" onClick={()=>location.href='story.html'}>Discover Stories</Button>
      </div>
    </div>
    <div style={{position:'relative',borderRadius:'var(--radius-2xl)',overflow:'hidden',minHeight:280,background:'linear-gradient(135deg,#3DDBFF22,#FFC93C22)',border:'1px solid var(--border-hairline)',padding:40,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <image-slot id="explorer-cta-art" style={{position:'absolute',inset:0}} placeholder="Photo — kid holding FunX explorer badge"></image-slot>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(0deg,rgba(11,11,13,0.85),rgba(11,11,13,0.15))'}}></div>
      <div style={{position:'relative'}}>
        <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:10}}>Become a FunX Explorer</div>
        <p style={{fontSize:15,color:'var(--text-secondary)',marginBottom:20,maxWidth:340}}>Join our universe, earn badges, unlock rewards and get special access to new toys.</p>
        <Button variant="secondary" size="md" onClick={()=>location.href='account.html'}>Join Now</Button>
      </div>
    </div>
  </section>;
}

function Newsletter(){
  const [email,setEmail] = React.useState('');
  const [subscribed,setSubscribed] = React.useState(false);
  return <section style={{maxWidth:1280,margin:'0 auto 96px',padding:'0 40px'}}>
    <div style={{borderRadius:'var(--radius-2xl)',background:'var(--surface-panel)',border:'1px solid var(--border-hairline)',padding:'64px',textAlign:'center'}}>
      <h2 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:700,fontSize:36,margin:'0 0 12px'}}>Find Magical Deals, First</h2>
      <p style={{color:'var(--text-muted)',maxWidth:440,margin:'0 auto 28px'}}>Sign up for early access to new drops and explorer-only offers.</p>
      {subscribed ? <div style={{fontSize:14,color:'var(--color-success)'}}>✓ You're on the list.</div> : <form onSubmit={(e)=>{e.preventDefault(); if(email.trim()) setSubscribed(true);}} style={{display:'flex',gap:10,justifyContent:'center',maxWidth:420,margin:'0 auto'}}>
        <input value={email} onChange={e=>setEmail(e.target.value)} type="email" required placeholder="you@example.com" style={{flex:1,height:48,borderRadius:'var(--radius-md)',border:'1px solid var(--border-hairline)',background:'var(--surface-card)',color:'var(--text-primary)',padding:'0 16px',fontSize:14,outline:'none'}}/>
        <button style={{height:48,padding:'0 24px',borderRadius:'var(--radius-md)',border:'none',background:'var(--color-primary)',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>Sign Up</button>
      </form>}
    </div>
  </section>;
}

function App(){
  return <div>
    <Header active="Home"/>
    <Hero/>
    <CategoryNav/>
    <FeaturedGrid/>
    <TrustStrip/>
    <StoryAndExplorer/>
    <Newsletter/>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
<script src="hero-portal.js"></script>
</body></html>
