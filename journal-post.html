<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Journal — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Breadcrumb, Card } = window.FunXDesignSystem_bbd8ae;

function App(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || window.JOURNAL_POSTS[0].slug;
  const post = window.JOURNAL_POSTS.find(p=>p.slug===slug) || window.JOURNAL_POSTS[0];
  const others = window.JOURNAL_POSTS.filter(p=>p.slug!==post.slug).slice(0,3);

  return <div>
    <Header active=""/>
    <div style={{maxWidth:760,margin:'0 auto',padding:'40px 40px 0'}} data-screen-label="Journal Post">
      <Breadcrumb items={['Our Story','Journal',post.title]}/>
    </div>
    <article style={{maxWidth:760,margin:'0 auto',padding:'24px 40px 0'}}>
      <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:16}}>{post.category} · {post.date} · {post.readTime}</div>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:48,lineHeight:1.05,margin:'0 0 32px'}}>{post.title}</h1>
    </article>
    <div style={{maxWidth:1000,margin:'0 auto',padding:'0 40px 48px'}}>
      <div style={{borderRadius:24,overflow:'hidden',height:420}}><image-slot id={`post-hero-${post.slug}`} style={{width:'100%',height:'100%'}} placeholder={`Photo — ${post.title}`}></image-slot></div>
    </div>
    <article style={{maxWidth:760,margin:'0 auto',padding:'0 40px 96px',fontSize:18,lineHeight:1.8,color:'var(--text-secondary)'}}>
      {post.body.map((para,i) => <p key={i} style={{marginBottom:24}}>{para}</p>)}
      <Card variant="dark" padding="lg" style={{marginTop:16}}>
        <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:6}}>Written by</div>
        <div style={{fontSize:15,fontWeight:600,color:'var(--text-primary)'}}>The FunX Provenance Desk</div>
      </Card>
    </article>
    <section style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px'}}>
      <SectionHeading title="More From the Journal"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:32}}>
        {others.map(p => <a key={p.slug} href={`journal-post.html?slug=${p.slug}`} style={{textDecoration:'none',color:'inherit',display:'block'}}>
          <div style={{borderRadius:'var(--radius-lg)',overflow:'hidden',height:180,marginBottom:16}}><image-slot id={`rel-${p.slug}`} style={{width:'100%',height:'100%'}} placeholder={`Photo — ${p.title}`}></image-slot></div>
          <div style={{fontSize:11,letterSpacing:1,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:8}}>{p.category}</div>
          <div style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:700,fontSize:20,lineHeight:1.25}}>{p.title}</div>
        </a>)}
      </div>
    </section>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
<script src="motion.js"></script>
</body></html>
