<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>New Arrivals — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Select, Tag } = window.FunXDesignSystem_bbd8ae;

function Hero(){
  return <section style={{position:'relative',height:360,display:'flex',alignItems:'center',overflow:'hidden'}} data-screen-label="New Arrivals">
    <div style={{position:'absolute',inset:0}}><image-slot id="hero-new" placeholder="Photo — newest die-cast release on studio backdrop"></image-slot></div>
    <div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,rgba(11,11,13,0.9) 10%,rgba(11,11,13,0.35) 100%)'}}></div>
    <div style={{position:'relative',maxWidth:1280,margin:'0 auto',padding:'0 40px',width:'100%'}}>
      <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:14}}>Just Landed</div>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:60,margin:0}}>New Arrivals</h1>
    </div>
  </section>;
}

function App(){
  const [sort,setSort] = React.useState('Newest');
  const [visible,setVisible] = React.useState(8);
  let list = window.PRODUCTS.filter(p=>p.isNew);
  if(sort==='Price: Low to High') list = [...list].sort((a,b)=>(a.salePrice||a.price)-(b.salePrice||b.price));
  if(sort==='Price: High to Low') list = [...list].sort((a,b)=>(b.salePrice||b.price)-(a.salePrice||a.price));

  return <div>
    <Header active="New"/>
    <Hero/>
    <section style={{maxWidth:1280,margin:'0 auto',padding:'64px 40px 0'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:32,flexWrap:'wrap',gap:16}}>
        <div style={{display:'flex',gap:10}}>
          {['All','Die-Cast','Action Figure'].map(t => <Tag key={t}>{t}</Tag>)}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:13,color:'var(--text-muted)'}}>{list.length} products</span>
          <div style={{width:200}}><Select value={sort} onChange={e=>setSort(e.target.value)} options={['Newest','Price: Low to High','Price: High to Low']}/></div>
        </div>
      </div>
      <ProductGrid products={list.slice(0,visible)} cols={4}/>
      {visible < list.length && <div style={{textAlign:'center',marginTop:48}}>
        <button onClick={()=>setVisible(v=>v+8)} style={{height:52,padding:'0 40px',borderRadius:'var(--radius-md)',border:'none',background:'var(--color-primary)',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>Load More</button>
      </div>}
    </section>
    <div style={{height:96}}></div>
    <PromoBanner title="First Look at Numbered Drops" sub="Collector's Circle members shop new arrivals 48 hours early." cta="Join Free" ctaHref="account.html"/>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
<script src="motion.js"></script>
</body></html>
