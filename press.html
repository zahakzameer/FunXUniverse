<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Breadcrumb, Button } = window.FunXDesignSystem_bbd8ae;

const MENTIONS = [
  ['Collector Quarterly','"The most credible provenance story in die-cast reissues right now."'],
  ['Foundry & Form','"FunX treats a numbered edition like an actual number, not a marketing word."'],
  ['The Cast Line','"A restoration story most toy brands would never bother telling."'],
];

function App(){
  return <div>
    <Header active=""/>
    <div style={{maxWidth:900,margin:'0 auto',padding:'40px 40px 0'}} data-screen-label="Press"><Breadcrumb items={['The Universe','Press']}/></div>
    <section style={{maxWidth:900,margin:'0 auto',padding:'24px 40px 0',textAlign:'center'}}>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:52,margin:'0 0 14px'}}>Press</h1>
      <p style={{color:'var(--text-secondary)',fontSize:16,maxWidth:520,margin:'0 auto 32px'}}>Media inquiries, brand assets, and interview requests.</p>
      <Button variant="primary" size="lg" onClick={()=>location.href='mailto:thefunxuniverse@gmail.com'}>thefunxuniverse@gmail.com</Button>
    </section>

    <section style={{maxWidth:900,margin:'0 auto',padding:'80px 40px 96px'}}>
      <SectionHeading title="In the Press"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24}}>
        {MENTIONS.map(([pub,quote]) => <div key={pub} style={{border:'1px solid var(--border-hairline-soft)',borderRadius:'var(--radius-lg)',padding:24}}>
          <div style={{fontSize:14,fontStyle:'italic',color:'var(--text-secondary)',lineHeight:1.7,marginBottom:14}}>{quote}</div>
          <div style={{fontSize:13,fontWeight:600,color:'var(--text-muted)'}}>— {pub}</div>
        </div>)}
      </div>
    </section>

    <section style={{maxWidth:900,margin:'0 auto',padding:'0 40px 96px'}}>
      <SectionHeading title="Brand Assets"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24}}>
        {['Logo Pack','Product Photography','Founder Headshots'].map(t => <div key={t} style={{border:'1px solid var(--border-hairline-soft)',borderRadius:'var(--radius-lg)',padding:'32px 24px',textAlign:'center'}}>
          <div style={{fontSize:15,fontWeight:600,marginBottom:14}}>{t}</div>
          {t==='Logo Pack'
            ? <a href="assets/logo.svg" download style={{display:'inline-flex',alignItems:'center',justifyContent:'center',height:36,padding:'0 16px',borderRadius:'var(--radius-md)',border:'1px solid var(--border-hairline)',fontSize:13,fontWeight:600,textDecoration:'none',color:'var(--text-primary)'}}>Download</a>
            : <a href="mailto:thefunxuniverse@gmail.com?subject=Press%20Asset%20Request" style={{display:'inline-flex',alignItems:'center',justifyContent:'center',height:36,padding:'0 16px',borderRadius:'var(--radius-md)',border:'1px solid var(--border-hairline)',fontSize:13,fontWeight:600,textDecoration:'none',color:'var(--text-primary)'}}>Request Access</a>}
        </div>)}
      </div>
    </section>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
