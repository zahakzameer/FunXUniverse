const { Breadcrumb, Button, Accordion } = window.FunXDesignSystem_bbd8ae;

function Stars({ rating }){
  return <div style={{display:'flex',gap:1}}>{[1,2,3,4,5].map(i => <span key={i}>{window.ICONS.star(i<=Math.round(rating))}</span>)}</div>;
}

function QtyStepper({ qty, setQty, max }){
  return <div style={{display:'flex',alignItems:'center',border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-sm)',width:120,height:48}}>
    <button onClick={()=>setQty(Math.max(1,qty-1))} style={{flex:1,height:'100%',background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',fontSize:18}}>−</button>
    <span style={{flex:1,textAlign:'center',fontSize:15}}>{qty}</span>
    <button onClick={()=>setQty(Math.min(max,qty+1))} style={{flex:1,height:'100%',background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',fontSize:18}}>+</button>
  </div>;
}

function SpecRow({ label, value }){
  return <div style={{display:'flex',justifyContent:'space-between',padding:'16px 0',borderBottom:'1px solid var(--border-hairline-soft)',fontSize:15}}>
    <span style={{color:'var(--text-muted)'}}>{label}</span><span style={{color:'var(--text-primary)',fontWeight:600}}>{value}</span>
  </div>;
}

// Real reviews backend (Phase 3, live RLS-tested): verified-purchase-only
// insert enforced server-side via a WITH CHECK against order_items/orders,
// so the eligibility check here is purely for UI state — the security
// boundary is the database policy, not this component.
function timeAgo(dateStr){
  const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  if (days < 1) return 'Today';
  if (days === 1) return '1 day ago';
  if (days < 30) return `${days} days ago`;
  const months = Math.floor(days/30);
  if (months < 12) return `${months} month${months>1?'s':''} ago`;
  const years = Math.floor(months/12);
  return `${years} year${years>1?'s':''} ago`;
}

function ReviewRow({ r }){
  return <div style={{padding:'16px 0',borderBottom:'1px solid var(--border-hairline-soft)',textAlign:'left'}}>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
      <Stars rating={r.rating}/>
      <span style={{fontSize:12,color:'var(--text-muted)'}}>Verified Buyer · {timeAgo(r.created_at)}</span>
    </div>
    {r.title && <div style={{fontWeight:600,fontSize:14,marginBottom:4}}>{r.title}</div>}
    {r.body && <p style={{fontSize:14,color:'var(--text-secondary)',margin:0}}>{r.body}</p>}
  </div>;
}

function ReviewForm({ productId, session, onSubmitted }){
  const { Input, Button } = window.FunXDesignSystem_bbd8ae;
  const [rating,setRating] = React.useState(0);
  const [hovered,setHovered] = React.useState(0);
  const [title,setTitle] = React.useState('');
  const [body,setBody] = React.useState('');
  const [error,setError] = React.useState('');
  const [saving,setSaving] = React.useState(false);

  const submit = () => {
    if (rating === 0) { setError('Pick a star rating first.'); return; }
    setSaving(true); setError('');
    window.supabaseClient.from('reviews').insert({
      product_id: productId, user_id: session.user.id, rating, title: title.trim() || null, body: body.trim() || null,
    }).select().single().then(({ data: row, error }) => {
      setSaving(false);
      if (error) { setError(error.message); return; }
      onSubmitted(row);
    });
  };

  return <div style={{textAlign:'left'}}>
    <div style={{fontSize:15,fontWeight:600,marginBottom:14,textAlign:'center'}}>Review this Product</div>
    <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:16}}>
      {[1,2,3,4,5].map(n => <button key={n} onClick={()=>setRating(n)} onMouseEnter={()=>setHovered(n)} onMouseLeave={()=>setHovered(0)} aria-label={`Rate ${n} star${n>1?'s':''}`} style={{width:44,height:44,borderRadius:'var(--radius-sm)',border:'1.5px solid var(--border-hairline)',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
        {window.ICONS.star(n <= (hovered||rating))}
      </button>)}
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:12,maxWidth:420,margin:'0 auto'}}>
      <Input placeholder="Title (optional)" value={title} onChange={e=>setTitle(e.target.value)}/>
      <textarea placeholder="Tell other collectors what you think (optional)" value={body} onChange={e=>setBody(e.target.value)} rows={3} style={{borderRadius:'var(--radius-md)',border:'1px solid var(--border-hairline)',background:'var(--surface-panel)',color:'var(--text-primary)',padding:'10px 14px',fontSize:14,fontFamily:'inherit',resize:'vertical'}}/>
      {error && <div style={{fontSize:13,color:'var(--color-error)'}}>{error}</div>}
      <Button variant="primary" size="md" onClick={submit} disabled={saving}>{saving ? 'Submitting…' : 'Submit Review'}</Button>
    </div>
  </div>;
}

function ReviewsPanel({ productId }){
  const { Button } = window.FunXDesignSystem_bbd8ae;
  const session = window.useSession();
  const [approved,setApproved] = React.useState(null);
  const [ownReview,setOwnReview] = React.useState(undefined); // undefined = loading, null = none
  const [eligible,setEligible] = React.useState(null);

  React.useEffect(() => {
    window.supabaseClient.from('reviews').select('*').eq('product_id',productId).eq('status','approved').order('created_at',{ascending:false}).then(({ data }) => setApproved(data || []));
  }, [productId]);

  React.useEffect(() => {
    if (session === undefined) return;
    if (!session) { setOwnReview(null); setEligible(false); return; }
    window.supabaseClient.from('reviews').select('*').eq('product_id',productId).eq('user_id',session.user.id).maybeSingle().then(({ data }) => {
      setOwnReview(data || null);
      if (data) return;
      window.supabaseClient.from('order_items').select('id, orders!inner(user_id,status)').eq('product_id',productId).eq('orders.user_id',session.user.id).eq('orders.status','delivered').limit(1).then(({ data: oi }) => {
        setEligible(!!(oi && oi.length));
      });
    });
  }, [session, productId]);

  const stillLoading = session === undefined || ownReview === undefined || (session && !ownReview && eligible === null);

  return <div style={{padding:'8px 0'}}>
    {stillLoading ? <div style={{minHeight:80}}/> : <>
      {!session && <div style={{textAlign:'center',marginBottom:28}}>
        <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:14}}>Sign in to write a review.</p>
        <a href="account.html" style={{textDecoration:'none'}}><Button variant="secondary" size="md">Sign In</Button></a>
      </div>}
      {session && ownReview && <div style={{textAlign:'center',marginBottom:28,padding:20,border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-md)'}}>
        <div style={{display:'flex',justifyContent:'center'}}><Stars rating={ownReview.rating}/></div>
        {ownReview.title && <div style={{fontWeight:600,fontSize:14,margin:'8px 0 4px'}}>{ownReview.title}</div>}
        {ownReview.body && <p style={{fontSize:14,color:'var(--text-secondary)'}}>{ownReview.body}</p>}
        <div style={{fontSize:12,color:'var(--text-muted)',marginTop:8}}>
          {ownReview.status === 'approved' ? 'Published' : ownReview.status === 'rejected' ? 'Not published' : 'Pending review by our team'}
        </div>
      </div>}
      {session && !ownReview && eligible && <div style={{marginBottom:28}}>
        <ReviewForm productId={productId} session={session} onSubmitted={(row)=>setOwnReview(row)}/>
      </div>}
      {session && !ownReview && eligible === false && <p style={{textAlign:'center',color:'var(--text-muted)',fontSize:14,marginBottom:28}}>Only customers who've received this item can leave a review.</p>}
    </>}

    <div style={{borderTop: (approved && approved.length>0) ? '1px solid var(--border-hairline-soft)' : 'none',paddingTop: (approved && approved.length>0) ? 20 : 0}}>
      {approved === null ? null : approved.length === 0 ? <p style={{textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Be the first to write a review.</p>
        : approved.map(r => <ReviewRow key={r.id} r={r}/>)}
    </div>
  </div>;
}

function WishlistButton({ productId }){
  const { isWishlisted, toggle } = window.useWishlist();
  const wish = isWishlisted(productId);
  const [justFilled,setJustFilled] = React.useState(false);
  const prevWish = React.useRef(wish);
  React.useEffect(() => {
    const becameFilled = wish && !prevWish.current;
    prevWish.current = wish;
    if (becameFilled) {
      setJustFilled(true);
      const t = setTimeout(()=>setJustFilled(false), 380);
      return () => clearTimeout(t);
    }
  }, [wish]);
  return <button onClick={()=>toggle(productId)} title={wish ? 'Remove from wishlist' : 'Save to wishlist'} style={{width:48,height:48,borderRadius:'50%',border:'1px solid var(--border-hairline)',background:'var(--surface-panel)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:wish?'var(--paint-red)':'var(--text-secondary)',flexShrink:0,transform:justFilled?'scale(1.15)':'scale(1)',transition:'transform var(--duration-slow) var(--ease-spring), color var(--duration-fast) var(--ease-standard)'}}>
    <svg width="19" height="19" viewBox="0 0 24 24" fill={wish?'currentColor':'none'} stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{transform:justFilled?'scale(1.1)':'scale(1)',transition:'transform var(--duration-slow) var(--ease-spring)'}}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
  </button>;
}

// Cursor-following magnifier: hovering the product photo shows a zoomed
// view panning with the mouse, the same pattern most retail PDPs use.
// Only applies to real photos — zooming a placeholder icon is meaningless.
function ZoomImage({ src, alt }){
  const [zoom,setZoom] = React.useState(false);
  const [pos,setPos] = React.useState({x:50,y:50});
  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setPos({ x: ((e.clientX-rect.left)/rect.width)*100, y: ((e.clientY-rect.top)/rect.height)*100 });
  };
  return <div
    onMouseEnter={()=>setZoom(true)} onMouseLeave={()=>setZoom(false)} onMouseMove={onMove}
    style={{width:'100%',height:'100%',cursor:'zoom-in',backgroundImage:`url(${src})`,backgroundRepeat:'no-repeat',backgroundSize: zoom ? '200%' : 'contain',backgroundPosition: zoom ? `${pos.x}% ${pos.y}%` : 'center',filter:'drop-shadow(0 30px 40px rgba(0,0,0,0.18))'}}
    role="img" aria-label={alt}>
  </div>;
}

function Hero({ p, qty, setQty, added, onAdd, onBuy }){
  const hasReal = p.images && p.images[0];
  const media = p.hasVideo ? [...p.images, '__video__'] : p.images;
  const [active,setActive] = React.useState(0);
  const videoRef = React.useRef(null);
  const colors = ['#F16A3E','#141416','#3DDBFF','#FFC93C'];
  React.useEffect(()=>{
    const v = videoRef.current;
    if (!v) return;
    if (media[active] === '__video__') { v.currentTime = 0; v.play().catch(()=>{}); } else { v.pause(); }
  },[active]);
  const price = p.salePrice || p.price;
  return <section style={{background:'linear-gradient(180deg,var(--surface-canvas),var(--surface-sunken))',padding:'72px 40px 56px',textAlign:'center'}} data-screen-label="Product Detail — Hero">
    <div style={{maxWidth:900,margin:'0 auto'}}>
      <div style={{fontSize:13,color:'var(--text-muted)',letterSpacing:1,textTransform:'uppercase',marginBottom:14}}>{p.category}</div>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:'clamp(38px,5.5vw,64px)',margin:'0 0 18px',lineHeight:1.02,letterSpacing:'-1.5px',color:'var(--text-primary)'}}>{window.titleCase(p.name)}</h1>
      <p style={{fontSize:18,color:'var(--text-secondary)',maxWidth:560,margin:'0 auto 28px',lineHeight:1.6}}>{p.description}</p>
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8}}>
        <Stars rating={p.rating}/>{p.reviews > 0 && <span style={{fontSize:13,color:'var(--text-muted)'}}>{p.rating} · {p.reviews} reviews</span>}
      </div>
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'center',gap:12,marginBottom:36}}>
        {p.salePrice ? <>
          <span style={{fontSize:26,fontWeight:700,color:'var(--paint-orange)'}}>{window.fmtPrice(p.salePrice)}</span>
          <span style={{fontSize:16,color:'var(--text-muted)',textDecoration:'line-through'}}>{window.fmtPrice(p.price)}</span>
        </> : <span style={{fontSize:26,fontWeight:700,color:'var(--text-primary)'}}>{window.fmtPrice(p.price)}</span>}
      </div>
    </div>
    <div style={{maxWidth:640,margin:'0 auto',aspectRatio:'1',borderRadius:32,overflow:'hidden',position:'relative',background:'var(--surface-gallery-card)',color:'var(--text-ink)',boxShadow:'0 40px 80px -20px rgba(0,0,0,0.5), var(--glow-gold)',marginBottom:28}}>
      {p.badge && <span style={{position:'absolute',top:20,right:20,zIndex:3,background: p.badge==='Sale' ? 'var(--color-error)' : p.badge==='Exclusive' ? 'var(--color-success)' : 'var(--color-warning)',color: p.badge==='Sale'||p.badge==='Exclusive' ? '#fff' : '#141416',fontSize:10,fontWeight:700,letterSpacing:1,textTransform:'uppercase',padding:'5px 10px',borderRadius:'var(--radius-pill)'}}>{p.badge}</span>}
      <div key={active} className="funx-gallery-in" style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',padding:'56px'}}>
        {media[active] === '__video__'
          ? <video ref={videoRef} muted loop playsInline controls style={{maxWidth:'100%',maxHeight:'100%',borderRadius:16}}><source src={p.videoSrc || `videos/${p.id}.mp4`} type="video/mp4"/></video>
          : (hasReal ? <ZoomImage src={p.images[active]} alt={p.name}/> : <image-slot id={`pdp-${p.id}-${active}`} style={{width:'80%',height:'80%'}} placeholder={`Photo of ${p.name}`}></image-slot>)
        }
      </div>
      {media.length > 1 && <div style={{position:'absolute',bottom:20,left:0,right:0,display:'flex',justifyContent:'center',gap:7}}>
        {media.map((m,i) => <button key={i} type="button" onClick={()=>setActive(i)} aria-label={`View image ${i+1} of ${media.length}`} aria-pressed={i===active} style={{width:7,height:7,padding:0,borderRadius:'50%',border:'none',cursor:'pointer',background: i===active ? '#141416' : '#14141633'}}></button>)}
      </div>}
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,justifyContent:'center',marginBottom:36}}>
      <span style={{fontSize:13,color:'var(--text-muted)',marginRight:4}}>Color</span>
      {colors.map((c,i) => <button key={c} type="button" onClick={()=>setActive(i % media.length)} aria-label={`Select color option ${i+1}`} aria-pressed={(i % media.length)===active} style={{width:26,height:26,padding:0,borderRadius:'50%',background:c,border: (i % media.length)===active ? '2px solid var(--text-primary)' : '2px solid transparent',cursor:'pointer',boxShadow:'0 0 0 1px #ffffff44 inset'}}></button>)}
    </div>
    <div style={{display:'flex',gap:14,justifyContent:'center',flexWrap:'wrap',maxWidth:480,margin:'0 auto'}}>
      <QtyStepper qty={qty} setQty={setQty} max={Math.max(1,p.quantity)}/>
      <Button variant="primary" size="lg" onClick={onAdd} disabled={p.quantity<=0} style={{minWidth:200}}>{p.quantity<=0 ? 'Out of Stock' : added ? 'Added ✓' : 'Add to Cart'}</Button>
      <WishlistButton productId={p.id}/>
    </div>
    <div style={{marginTop:14}}><Button variant="secondary" size="md" onClick={onBuy}>Buy Now</Button></div>
    <StockLabel stock={p.quantity}/>
    <p style={{fontSize:12,color:'var(--text-muted)',marginTop:10}}>Shipping calculated at checkout.</p>
    <div style={{marginTop:20}}><TrustRow align="center"/></div>
  </section>;
}

function StickyBar({ p, onAdd, added, visible }){
  const price = p.salePrice || p.price;
  // pointerEvents must travel with the transform — translateY(-100%) alone
  // still leaves this in normal flow near the top of the page (right below
  // the 80px header), so before `visible` it was a real, clickable,
  // overlapping "Add to Cart" that silently ate clicks meant for the header.
  return <div style={{position:'sticky',top:80,zIndex:20,background:'rgba(11,11,13,0.92)',backdropFilter:'blur(10px)',borderBottom:'1px solid var(--border-hairline-soft)',transform: visible ? 'translateY(0)' : 'translateY(-100%)',pointerEvents: visible ? 'auto' : 'none',transition:'transform .3s ease',padding:'14px 40px',display:'flex',alignItems:'center',justifyContent:'space-between',maxWidth:1280,margin:'0 auto'}}>
    <div style={{display:'flex',alignItems:'center',gap:14}}>
      <span style={{fontSize:15,fontWeight:700,color:'var(--text-primary)'}}>{window.titleCase(p.name)}</span>
      <span style={{fontSize:14,color:'var(--text-muted)'}}>{window.fmtPrice(price)}</span>
    </div>
    <Button variant="primary" size="md" onClick={onAdd} disabled={p.quantity<=0}>{added ? 'Added ✓' : 'Add to Cart'}</Button>
  </div>;
}

function FeatureRow({ img, eyebrow, title, text, reverse }){
  const isMobile = window.useIsMobile();
  return <div style={{display:'grid',gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',gap: isMobile ? 24 : 64,alignItems:'center',maxWidth:1100,margin:'0 auto',padding: isMobile ? '48px 20px' : '80px 40px',direction: (reverse && !isMobile) ? 'rtl' : 'ltr'}}>
    <div style={{aspectRatio:'4/3',borderRadius:24,overflow:'hidden',background:'var(--surface-gallery)',color:'var(--text-ink)',border:'1px solid var(--border-gallery)',direction:'ltr'}}>
      {img ? <img src={img} alt={title} style={{width:'100%',height:'100%',objectFit:'cover'}}/> : <image-slot id={`pdp-feature-${title}`} style={{width:'100%',height:'100%'}} placeholder={title}></image-slot>}
    </div>
    <div style={{direction:'ltr'}}>
      <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:14}}>{eyebrow}</div>
      <h2 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:700,fontSize:32,margin:'0 0 16px',color:'var(--text-primary)'}}>{title}</h2>
      <p style={{fontSize:16,color:'var(--text-secondary)',lineHeight:1.7}}>{text}</p>
    </div>
  </div>;
}

function App(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'p1';
  const p = window.PRODUCTS.find(x=>x.id===id) || window.PRODUCTS[0];
  const [qty,setQty] = React.useState(1);
  const [added,setAdded] = React.useState(false);
  const [stickyVisible,setStickyVisible] = React.useState(false);
  const related = window.PRODUCTS.filter(x => x.id!==p.id && x.category===p.category).slice(0,4);

  React.useEffect(()=>{
    const onScroll = () => setStickyVisible(window.scrollY > 640);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  },[]);

  // This template serves every product behind ?id=..., so the static
  // <head> tags (same for every product) are just a safe fallback for
  // crawlers that don't run JS. Real visitors and JS-rendering crawlers
  // get the actual per-product title/description/canonical/JSON-LD here —
  // without this, every product would canonicalize to the same bare
  // product.html URL and Google would treat them as duplicates.
  React.useEffect(() => {
    const pageTitle = `${window.titleCase(p.name)} — The FunX Universe`;
    const desc = p.description || `Shop ${window.titleCase(p.name)} at The FunX Universe.`;
    const url = location.href;
    const price = p.salePrice || p.price;
    const image = (p.images && p.images[0]) || 'https://funxuniverse.com/assets/hero-universe.jpg';

    document.title = pageTitle;
    const setMeta = (selector, attr, value) => {
      const el = document.querySelector(selector);
      if (el) el.setAttribute(attr, value);
    };
    setMeta('meta[name="description"]', 'content', desc);
    setMeta('link[rel="canonical"]', 'href', url);
    setMeta('meta[property="og:title"]', 'content', pageTitle);
    setMeta('meta[property="og:description"]', 'content', desc);
    setMeta('meta[property="og:url"]', 'content', url);
    setMeta('meta[property="og:image"]', 'content', image);
    setMeta('meta[property="og:type"]', 'content', 'product');
    setMeta('meta[name="twitter:title"]', 'content', pageTitle);
    setMeta('meta[name="twitter:description"]', 'content', desc);

    let ld = document.getElementById('funx-product-jsonld');
    if (!ld) {
      ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.id = 'funx-product-jsonld';
      document.head.appendChild(ld);
    }
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'Product',
      name: window.titleCase(p.name),
      description: desc,
      image,
      sku: p.sku,
      brand: { '@type': 'Brand', name: p.brand || 'The FunX Universe' },
      offers: {
        '@type': 'Offer',
        url,
        priceCurrency: 'PKR',
        price,
        availability: p.quantity > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
      },
    });
  }, [p.id]);

  const addToCart = () => { window.addToCart(p.id, qty); setAdded(true); setTimeout(()=>setAdded(false),2200); };
  const buyNow = () => { window.addToCart(p.id, qty); location.href='cart.html'; };

  return <div>
    <Header active=""/>
    <div id="main-content" tabIndex={-1} style={{outline:'none'}}></div>
    <StickyBar p={p} onAdd={addToCart} added={added} visible={stickyVisible}/>
    <div style={{maxWidth:1280,margin:'0 auto',padding:'20px 40px 0',background:'var(--surface-canvas)'}}>
      <Breadcrumb items={['Shop All',p.category,p.name]}/>
    </div>

    <Hero p={p} qty={qty} setQty={setQty} added={added} onAdd={addToCart} onBuy={buyNow}/>

    <FeatureRow img={p.images && p.images[1]} eyebrow="Built To Play" title={`Why We Love This ${p.category} Pick`} text={`${window.titleCase(p.name)} is part of our ${p.category} lineup, chosen for real play and everyday use — not just for the shelf.`}/>
    <FeatureRow img={p.images && p.images[2]} eyebrow="Details That Matter" title="Crafted For Collectors" text="Sample-tested by our team before it ever ships, so what arrives matches what you saw." reverse/>

    <section style={{maxWidth:760,margin:'0 auto',padding:'0 40px 96px'}}>
      <Accordion items={[
        {title:'Product Details', content: <div>
          <SpecRow label="Brand" value={p.brand}/>
      <SpecRow label="Category" value={p.category}/>
      <SpecRow label="SKU" value={p.sku}/>
      <SpecRow label="Material" value={p.material}/>
      <SpecRow label="Color" value={p.color}/>
      <SpecRow label="Electronic" value={p.is_electronic ? 'Yes' : 'No'}/>
      <SpecRow label="Recommended Age" value={p.age_group}/>
      {p.boxDims && <SpecRow label="Box Dimensions" value={p.boxDims}/>}
      {p.weight && <SpecRow label="Weight" value={p.weight}/>}
        </div>},
        {title:'Shipping & Delivery', content:'Ships in 2 business days if in stock. 30-day returns on unworn pieces in original packaging — see our Shipping and Returns pages for full details.'},
        {title:'Reviews', content: <ReviewsPanel productId={p.id}/>},
      ]}/>
    </section>

    {related.length > 0 && <section style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px'}}>
      <SectionHeading eyebrow="You May Also Like" title={`More ${p.category}`}/>
      <ProductGrid products={related} cols={4}/>
    </section>}

    <PromoBanner title="Earn Rewards On Every Order" sub="Join the Collector's Circle and earn credit toward your next purchase." cta="Learn More"/>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
