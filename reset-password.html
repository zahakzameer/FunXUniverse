<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password — The FunX Universe</title>
<meta name="description" content="Set a new password for your FunX Universe account.">
<link rel="canonical" href="https://funxuniverse.com/reset-password.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The FunX Universe">
<meta property="og:title" content="Set New Password — The FunX Universe">
<meta property="og:description" content="Set a new password for your FunX Universe account.">
<meta property="og:url" content="https://funxuniverse.com/reset-password.html">
<meta property="og:image" content="https://funxuniverse.com/assets/hero-universe.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Set New Password — The FunX Universe">
<meta name="twitter:description" content="Set a new password for your FunX Universe account.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Input, Button, Card } = window.FunXDesignSystem_bbd8ae;

function App(){
  // Supabase auto-detects the recovery token in the URL on load and fires a
  // PASSWORD_RECOVERY auth event once it establishes a temporary session for
  // it. Default to "not ready" (shows an expired-link message) until either
  // that event fires or an active session shows up — same defensive pattern
  // as the getSession()/onAuthStateChange race fixed in admin.html earlier,
  // just applied to a case where BOTH signals legitimately mean "ready".
  const [ready,setReady] = React.useState(false);
  const [form,setForm] = React.useState({password:'',confirm:''});
  const [error,setError] = React.useState('');
  const [pending,setPending] = React.useState(false);
  const [done,setDone] = React.useState(false);

  React.useEffect(() => {
    const { data: sub } = window.supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') setReady(true);
    });
    window.supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) setReady(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  const update = (k) => (e) => setForm({...form,[k]:e.target.value});

  const submit = (e) => {
    e.preventDefault();
    setError('');
    if (form.password.length < 8) { setError('Password must be at least 8 characters.'); return; }
    if (form.password !== form.confirm) { setError("Passwords don't match."); return; }
    setPending(true);
    window.supabaseClient.auth.updateUser({ password: form.password }).then(({ error }) => {
      setPending(false);
      if (error) { setError(error.message); return; }
      setDone(true);
    });
  };

  return <div>
    <Header active=""/>
    <section style={{minHeight:'calc(100vh - 156px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'64px 40px',background:'var(--surface-sunken)'}} data-screen-label="Reset Password">
      <Card variant="dark" padding="lg" style={{width:420}}>
        {done ? <div style={{textAlign:'center',padding:'12px 0'}}>
          <div style={{fontSize:36,marginBottom:14,color:'var(--color-success)'}}>✓</div>
          <h3 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:26,margin:'0 0 10px'}}>Password updated</h3>
          <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:24}}>Your password has been changed.</p>
          <Button variant="primary" size="md" onClick={()=>location.href='account.html'}>Go to My Account</Button>
        </div> : !ready ? <div style={{textAlign:'center',padding:'12px 0'}}>
          <h3 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:26,margin:'0 0 10px'}}>Link expired or invalid</h3>
          <p style={{color:'var(--text-muted)',fontSize:14,marginBottom:24}}>This password reset link is no longer valid. Request a new one below.</p>
          <a href="forgot-password.html" style={{fontSize:13}}>Request New Link</a>
        </div> : <>
          <div style={{textAlign:'center',marginBottom:24}}>
            <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:12}}>Collector's Circle</div>
            <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:32,margin:'0 0 10px'}}>Set New Password</h1>
          </div>
          <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20}}>
            <Input label="New password" type="password" placeholder="At least 8 characters" value={form.password} onChange={update('password')} required/>
            <Input label="Confirm password" type="password" placeholder="Re-enter your password" value={form.confirm} onChange={update('confirm')} required/>
            {error && <div style={{fontSize:13,color:'var(--color-error)'}}>{error}</div>}
            <Button variant="primary" size="lg" disabled={pending}>{pending ? 'Saving…' : 'Set New Password'}</Button>
          </form>
        </>}
      </Card>
    </section>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
