<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Sale — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Button } = window.FunXDesignSystem_bbd8ae;

function Hero(){
  return <section style={{position:'relative',height:420,display:'flex',alignItems:'center',overflow:'hidden'}} data-screen-label="Sale — Hero">
    <div style={{position:'absolute',inset:0}}><image-slot id="hero-sale" placeholder="Photo — markdown die-cast pieces staged on studio backdrop"></image-slot></div>
    <div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,rgba(11,11,13,0.92) 15%,rgba(11,11,13,0.3) 100%)'}}></div>
    <div style={{position:'relative',maxWidth:1280,margin:'0 auto',padding:'0 40px',width:'100%'}}>
      <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--paint-yellow)',textTransform:'uppercase',marginBottom:14}}>Limited Time</div>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:64,margin:'0 0 20px'}}>Current Sale</h1>
      <Button variant="primary" size="lg" onClick={()=>{const el=document.getElementById('deals');if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-100,behavior:'smooth'});}}>Shop All Sale</Button>
    </div>
  </section>;
}

function PromoTile({ label, sub, cta, href }){
  return <div style={{borderRadius:'var(--radius-xl)',overflow:'hidden',position:'relative',height:280}}>
    <image-slot id={`promo-${label}`} style={{width:'100%',height:'100%'}} placeholder={`Photo — ${label}`}></image-slot>
    <div style={{position:'absolute',left:0,right:0,bottom:0,background:'linear-gradient(0deg,rgba(11,11,13,0.85),transparent)',padding:24}}>
      <div style={{fontSize:11,letterSpacing:1,fontWeight:700,color:'var(--paint-yellow)',textTransform:'uppercase',marginBottom:6}}>{label}</div>
      <div style={{fontSize:18,fontWeight:600,marginBottom:10}}>{sub}</div>
      <a href={href} style={{fontSize:13,color:'var(--text-link)',textDecoration:'underline'}}>{cta}</a>
    </div>
  </div>;
}

function DealsRow({ title, items }){
  return <section id="deals" style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px'}}>
    <SectionHeading title={title}/>
    <ProductGrid products={items} cols={4}/>
  </section>;
}

function ShopByEra(){
  return <section style={{maxWidth:1280,margin:'0 auto',padding:'0 40px 96px'}}>
    <SectionHeading title="Shop by Universe"/>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
      {[['Skyline Riders','Racing die-cast, 1960s–80s tooling'],['Ironclad Legion','Collector action figures']].map(([t,s]) => <div key={t} style={{position:'relative',borderRadius:'var(--radius-xl)',overflow:'hidden',height:260}}>
        <image-slot id={`era-${t}`} style={{width:'100%',height:'100%'}} placeholder={`Photo — ${t}`}></image-slot>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',background:'rgba(11,11,13,0.35)'}}>
          <div style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:32,marginBottom:8}}>{t}</div>
          <div style={{fontSize:14,color:'var(--text-secondary)'}}>{s}</div>
        </div>
      </div>)}
    </div>
  </section>;
}

function App(){
  const saleItems = window.PRODUCTS.filter(p=>p.isSale);
  return <div>
    <Header active="Sale"/>
    <Hero/>
    <section style={{maxWidth:1280,margin:'0 auto',padding:'96px 40px 96px'}}>
      <SectionHeading title="More Ways to Save"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24}}>
        <PromoTile label="Limited Time" sub="Up to 40% off Skyline Riders" cta="Shop Skyline Riders" href="toys-plush.html"/>
        <PromoTile label="Collector's Circle" sub="Members save an extra 10%" cta="Join Free" href="account.html"/>
        <PromoTile label="Bundle & Save" sub="Founders sets, marked down" cta="Shop Founders Sets" href="collectibles.html"/>
      </div>
    </section>
    <DealsRow title="Deals For You" items={saleItems}/>
    <ShopByEra/>
    <div style={{textAlign:'center',marginBottom:96}}>
      <Button variant="chrome" size="lg" onClick={()=>{const el=document.getElementById('deals');if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-100,behavior:'smooth'});}}>Shop All Sale</Button>
    </div>
    <PromoBanner title="Earn Toward Your Next Numbered Run" sub="Join the Collector's Circle and earn credit on every order." cta="Learn More"/>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
<script src="motion.js"></script>
</body></html>
