<body>
<div id="root"><div style="min-height:100vh;background:var(--surface-canvas,#0b0b0d)"><div style="height:80px;display:flex;align-items:center;padding:0 40px;gap:16px;border-bottom:1px solid var(--border-hairline-soft,#2A2A2E)"><div class="funx-skeleton" style="width:110px;height:26px;border-radius:6px"></div><div style="flex:1"></div><div class="funx-skeleton" style="width:22px;height:22px;border-radius:50%"></div><div class="funx-skeleton" style="width:22px;height:22px;border-radius:50%"></div><div class="funx-skeleton" style="width:22px;height:22px;border-radius:50%"></div></div><div style="max-width:1280px;margin:0 auto;padding:56px 40px 0;text-align:center"><div class="funx-skeleton" style="width:280px;height:44px;border-radius:8px;margin:0 auto"></div></div><div style="max-width:1280px;margin:0 auto;padding:40px 40px 0;display:flex;gap:48"><div style="width:236px;flexShrink:0"><div class="funx-skeleton" style="height:400px;border-radius:12px"></div></div><div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:40px">
<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
<div><div class="funx-skeleton" style="aspect-ratio:1;border-radius:16px;margin-bottom:16px"></div><div class="funx-skeleton" style="width:50%;height:11px;border-radius:4px;margin-bottom:8px"></div><div class="funx-skeleton" style="width:85%;height:16px;border-radius:4px;margin-bottom:10px"></div><div class="funx-skeleton" style="width:35%;height:15px;border-radius:4px"></div></div>
</div></div></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Breadcrumb, Select } = window.FunXDesignSystem_bbd8ae;

function PageHeader(){
  return <div style={{maxWidth:1280,margin:'0 auto',padding:'56px 40px 40px',textAlign:'center'}} data-screen-label="Shop All">
    <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:56,margin:'0 0 14px'}}>Shop All</h1>
    <p style={{color:'var(--text-secondary)',fontSize:17}}>The full FunX catalog, across every category.</p>
  </div>;
}

function Toolbar({ count, sort, setSort }){
  return <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:28,flexWrap:'wrap',gap:16}}>
    <div>
      <Breadcrumb items={['Shop All']}/>
      <div style={{fontSize:13,color:'var(--text-muted)',marginTop:8}}>{count} products</div>
    </div>
    <div style={{width:220}}><Select value={sort} onChange={e=>setSort(e.target.value)} options={['Featured','Price: Low to High','Price: High to Low','Name: A to Z']}/></div>
  </div>;
}

// Price buckets are derived from the real catalog's distribution (roughly
// its quartiles: 365 / 625 / 1160 PKR), not arbitrary round numbers.
const PRICE_MATCHERS = {
  'Under PKR 400': p => (p.salePrice||p.price) < 400,
  'PKR 400–800': p => (p.salePrice||p.price) >= 400 && (p.salePrice||p.price) < 800,
  'PKR 800–1,500': p => (p.salePrice||p.price) >= 800 && (p.salePrice||p.price) < 1500,
  'PKR 1,500+': p => (p.salePrice||p.price) >= 1500,
};
const AVAILABILITY_MATCHERS = {
  'In Stock': p => p.quantity > 0,
  'Out of Stock': p => p.quantity <= 0,
};

function useFilters(groupTitles){
  const [filters,setFilters] = React.useState(() => Object.fromEntries(groupTitles.map(t=>[t,[]])));
  const toggle = (title,option) => setFilters(f => ({...f, [title]: f[title].includes(option) ? f[title].filter(x=>x!==option) : [...f[title], option]}));
  const clear = () => setFilters(Object.fromEntries(groupTitles.map(t=>[t,[]])));
  return { filters, setFilters, toggle, clear };
}

function App(){
  const isMobile = window.useIsMobile();
  const [sort,setSortRaw] = React.useState('Featured');
  const [visible,setVisible] = React.useState(16);
  const { filters, setFilters, toggle: rawToggle, clear: rawClear } = useFilters(['Category','Price','Age Group','Availability']);

  // FLIP animation: capture card positions right before a filter/sort
  // change, then animate from those positions to wherever the cards land
  // after the re-render, so results reflow smoothly instead of jump-cutting.
  const flipStateRef = React.useRef(null);
  const captureFlip = () => {
    if (!window.Flip || !window.gsap) return;
    window.gsap.registerPlugin(window.Flip);
    flipStateRef.current = window.Flip.getState('#product-grid a[href^="product.html?id="]');
  };
  const toggle = (title, option) => { captureFlip(); rawToggle(title, option); };
  const clear = () => { captureFlip(); rawClear(); };
  const setSort = (v) => { captureFlip(); setSortRaw(v); };

  // Pre-check the category filter when arriving from the Shop All mega-menu
  // or a category tile (?category=Building+Blocks), once, on first mount.
  React.useEffect(() => {
    const category = new URLSearchParams(location.search).get('category');
    if (category) setFilters(f => ({...f, Category: [category]}));
  }, []);

  const ageGroups = [...new Set(window.PRODUCTS.map(p=>p.age_group).filter(Boolean))].sort();

  let list = window.PRODUCTS;
  if (filters.Category.length) list = list.filter(p => filters.Category.includes(p.category));
  if (filters.Price.length) list = list.filter(p => filters.Price.some(o => PRICE_MATCHERS[o](p)));
  if (filters['Age Group'].length) list = list.filter(p => filters['Age Group'].includes(p.age_group));
  if (filters.Availability.length) list = list.filter(p => filters.Availability.some(o => AVAILABILITY_MATCHERS[o](p)));

  if (sort==='Price: Low to High') list = [...list].sort((a,b)=>(a.salePrice||a.price)-(b.salePrice||b.price));
  if (sort==='Price: High to Low') list = [...list].sort((a,b)=>(b.salePrice||b.price)-(a.salePrice||a.price));
  if (sort==='Name: A to Z') list = [...list].sort((a,b)=>a.name.localeCompare(b.name));

  const groups = [
    {title:'Category', options:window.CATEGORIES, selected:filters.Category, onToggle:(o)=>toggle('Category',o)},
    {title:'Price', options:['Under PKR 400','PKR 400–800','PKR 800–1,500','PKR 1,500+'], selected:filters.Price, onToggle:(o)=>toggle('Price',o)},
    {title:'Age Group', options:ageGroups, selected:filters['Age Group'], onToggle:(o)=>toggle('Age Group',o)},
    {title:'Availability', options:['In Stock','Out of Stock'], selected:filters.Availability, onToggle:(o)=>toggle('Availability',o)},
  ];
  const activeChips = groups.flatMap(g => g.selected.map(o => ({group:g.title, option:o})));

  const listKey = list.map(p=>p.id).join(',');
  const prevListKeyRef = React.useRef(listKey);
  React.useLayoutEffect(() => {
    if (prevListKeyRef.current !== listKey && flipStateRef.current && window.Flip) {
      window.Flip.from(flipStateRef.current, { duration: 0.5, ease: 'power2.out', stagger: 0.02, absolute: true });
      flipStateRef.current = null;
    }
    prevListKeyRef.current = listKey;
  }, [listKey]);

  return <div>
    <Header active="Categories"/>
    <div id="main-content" tabIndex={-1} style={{outline:'none'}}></div>
    <PageHeader/>
    <section id="grid" style={{maxWidth:1280,margin:'0 auto',padding: isMobile ? '24px 20px 0' : '40px 40px 0',display:'flex',flexDirection: isMobile ? 'column' : 'row',gap: isMobile ? 20 : 48}}>
      <FilterSidebar groups={groups} onClear={clear}/>
      <div style={{flex:1}}>
        {activeChips.length > 0 && <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20}}>
          {activeChips.map(c => <button key={c.group+c.option} onClick={()=>toggle(c.group,c.option)} aria-label={`Remove ${c.option} filter`} style={{display:'flex',alignItems:'center',gap:6,height:32,padding:'0 8px 0 14px',borderRadius:'var(--radius-pill)',border:'1px solid var(--border-hairline)',background:'var(--surface-panel)',color:'var(--text-primary)',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            {c.option}
            <span style={{display:'flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:'50%',background:'var(--surface-gallery)',color:'var(--text-muted)'}}>×</span>
          </button>)}
          <button onClick={clear} style={{height:32,padding:'0 12px',borderRadius:'var(--radius-pill)',border:'none',background:'none',color:'var(--text-link)',fontSize:12,fontWeight:600,cursor:'pointer'}}>Clear all</button>
        </div>}
        <Toolbar count={list.length} sort={sort} setSort={setSort}/>
        {list.length === 0 ? <div style={{textAlign:'center',padding:'80px 0',color:'var(--text-muted)'}}>No products match these filters.</div> : <>
          <div id="product-grid"><ProductGrid products={list.slice(0,visible)} cols={4}/></div>
          {visible < list.length && <div style={{textAlign:'center',marginTop:48}}>
            <button onClick={()=>setVisible(v=>v+16)} style={{height:52,padding:'0 40px',borderRadius:'var(--radius-md)',border:'none',background:'var(--color-primary)',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>Load More</button>
          </div>}
        </>}
      </div>
    </section>
    <div style={{height:96}}></div>
    <PromoBanner title="Earn Rewards On Every Order" sub="Join the Collector's Circle and earn credit toward your next purchase." cta="Learn More"/>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
