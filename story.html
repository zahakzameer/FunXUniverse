<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Our Story — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Card } = window.FunXDesignSystem_bbd8ae;

function Hero(){
  return <section style={{position:'relative',height:560,display:'flex',alignItems:'flex-end',overflow:'hidden'}} data-screen-label="Our Story">
    <div style={{position:'absolute',inset:0}}><image-slot id="story-hero-main" placeholder="Photo — Muhammad bin Zameer with the first FunX prototype shipment"></image-slot></div>
    <div style={{position:'absolute',inset:0,background:'linear-gradient(0deg,rgba(11,11,13,0.95) 10%,rgba(11,11,13,0.1) 70%)'}}></div>
    <div style={{position:'relative',maxWidth:1280,margin:'0 auto',padding:'0 40px 64px',width:'100%'}}>
      <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:16}}>Founded 2026</div>
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:72,lineHeight:1,margin:'0 0 20px',maxWidth:760}}>Never Grew Out Of It</h1>
      <p style={{fontSize:18,color:'var(--text-secondary)',maxWidth:520,lineHeight:1.6}}>FunX started with one person who never stopped playing — and a plan to bring that feeling to players everywhere.</p>
    </div>
  </section>;
}

function Chapter({ eyebrow, title, children, image, reverse }){
  return <section style={{maxWidth:1280,margin:'0 auto',padding:'96px 40px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:64,alignItems:'center'}}>
    <div style={{order:reverse?2:1}}>
      <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:16}}>{eyebrow}</div>
      <h2 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:40,lineHeight:1.1,margin:'0 0 22px'}}>{title}</h2>
      <div style={{fontSize:16,lineHeight:1.75,color:'var(--text-secondary)',display:'flex',flexDirection:'column',gap:16}}>{children}</div>
    </div>
    <div style={{order:reverse?1:2,borderRadius:24,overflow:'hidden',height:400}}><image-slot id={image} placeholder={image.replace(/-/g,' ')}></image-slot></div>
  </section>;
}

function Stats(){
  const stats = [['22','Founder\u2019s age at launch'],['2026','Year FunX opened its doors'],['3','Startups it took to get here'],['1','Toy shelf that never got boring']];
  return <section style={{background:'var(--surface-sunken)',padding:'64px 40px'}}>
    <div style={{maxWidth:1280,margin:'0 auto',display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:24,textAlign:'center'}}>
      {stats.map(([n,l]) => <div key={l}>
        <div style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:56,color:'var(--paint-orange)',lineHeight:1}}>{n}</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginTop:10}}>{l}</div>
      </div>)}
    </div>
  </section>;
}

function JournalCard({ post }){
  return <a href={`journal-post.html?slug=${post.slug}`} style={{textDecoration:'none',color:'inherit',display:'block'}}>
    <div style={{borderRadius:'var(--radius-lg)',overflow:'hidden',height:220,marginBottom:18}}><image-slot id={`journal-${post.slug}`} style={{width:'100%',height:'100%'}} placeholder={`Photo — ${post.title}`}></image-slot></div>
    <div style={{fontSize:11,letterSpacing:1,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:8}}>{post.category} · {post.readTime}</div>
    <div style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:700,fontSize:24,marginBottom:10,lineHeight:1.2}}>{post.title}</div>
    <p style={{fontSize:14,color:'var(--text-muted)',lineHeight:1.6,margin:0}}>{post.excerpt}</p>
  </a>;
}

function Journal(){
  return <section style={{maxWidth:1280,margin:'0 auto',padding:'96px 40px'}}>
    <SectionHeading eyebrow="From the Journal" title="Notes From the Founder"/>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:32}}>
      {window.JOURNAL_POSTS.map(p => <JournalCard key={p.slug} post={p}/>)}
    </div>
  </section>;
}

function App(){
  return <div>
    <Header active=""/>
    <Hero/>
    <Chapter eyebrow="Before FunX" title="Two Startups, One Shelf That Never Changed" image="story-warehouse">
      <p>Muhammad bin Zameer started thinking about being a founder at twenty. Two small startups followed — both taught him plenty, neither one felt like his.</p>
      <p>The one constant through both attempts was a bedroom shelf lined with die-cast cars, RC builds, and action figures he never actually stopped playing with, no matter how "serious" the day job got.</p>
    </Chapter>
    <Chapter eyebrow="2026" title="FunX Opens Its Doors" image="story-restoration" reverse>
      <p>At twenty-five, he stopped trying to build what a company was "supposed" to look like and built the store he'd always wanted as a kid — and still wanted as an adult.</p>
      <p>FunX launched in 2026 with a small catalog and one honest brief: make toys worth unboxing, worth playing with, and worth keeping on the shelf long after the box is opened.</p>
    </Chapter>
    <Chapter eyebrow="What's Next" title="Built to Go Global From Day One" image="story-global">
      <p>FunX is young, and we're not pretending otherwise. But the mission was never to stay small — it's to bring this catalog, and the community around it, to players and collectors everywhere.</p>
      <p>That means listening closely to our first customers, shipping quality that holds up, and expanding deliberately — one market, one drop, one happy shelf at a time.</p>
    </Chapter>
    <Stats/>
    <Journal/>
    <PromoBanner title="Follow the Founder's Notes" sub="New posts on building FunX, one drop at a time." cta="Read the Journal" ctaHref="journal-post.html"/>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
