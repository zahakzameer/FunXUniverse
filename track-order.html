<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Order — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Input, Button } = window.FunXDesignSystem_bbd8ae;

const STAGES = ['Order Confirmed','In Production','Shipped','Out for Delivery','Delivered'];

function Timeline({ stage }){
  return <div style={{display:'flex',alignItems:'flex-start',marginTop:40}}>
    {STAGES.map((s,i) => <React.Fragment key={s}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',width:110}}>
        <div style={{width:32,height:32,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background: i<=stage ? 'var(--color-primary)' : 'var(--surface-panel)',border: i<=stage ? 'none' : '1px solid var(--border-hairline)',color:'#fff',fontSize:13,fontWeight:700,flexShrink:0}}>{i<stage ? '✓' : i+1}</div>
        <div style={{fontSize:12,color: i<=stage ? 'var(--text-primary)' : 'var(--text-muted)',textAlign:'center',marginTop:10,lineHeight:1.4}}>{s}</div>
      </div>
      {i < STAGES.length-1 && <div style={{flex:1,height:2,background: i<stage ? 'var(--color-primary)' : 'var(--border-hairline)',marginTop:15}}></div>}
    </React.Fragment>)}
  </div>;
}

function App(){
  const [order,setOrder] = React.useState('');
  const [email,setEmail] = React.useState('');
  const [result,setResult] = React.useState(null);

  const submit = (e) => {
    e.preventDefault();
    setResult({ id: order || 'FX-10482', stage: 2, item: window.PRODUCTS[4], eta: 'Aug 6, 2026' });
  };

  return <div>
    <Header active=""/>
    <section style={{maxWidth:760,margin:'0 auto',padding:'72px 40px 0',textAlign:'center'}} data-screen-label="Track Order">
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:48,margin:'0 0 14px'}}>Track Your Order</h1>
      <p style={{color:'var(--text-secondary)',fontSize:16}}>Enter your order number and email to see production and shipping status.</p>
    </section>

    <section style={{maxWidth:520,margin:'0 auto',padding:'40px 40px 0'}}>
      <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20,border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,background:'var(--surface-panel)'}}>
        <Input label="Order number" placeholder="FX-10482" value={order} onChange={e=>setOrder(e.target.value)} required/>
        <Input label="Email" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required/>
        <Button variant="primary" size="lg">Track Order</Button>
      </form>
    </section>

    {result && <section style={{maxWidth:760,margin:'0 auto',padding:'56px 40px 96px'}}>
      <div style={{border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:36}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontSize:14,color:'var(--text-muted)'}}>Order {result.id}</div>
          <div style={{fontSize:14,color:'var(--paint-orange)',fontWeight:600}}>Est. delivery {result.eta}</div>
        </div>
        <div style={{display:'flex',gap:16,alignItems:'center',marginTop:20}}>
          <div style={{width:72,height:72,borderRadius:'var(--radius-md)',overflow:'hidden',background:'var(--surface-gallery)',color:'var(--text-ink)',border:'1px solid var(--border-gallery)',flexShrink:0}}>
            <image-slot id="track-item" style={{width:'100%',height:'100%'}} placeholder={`Photo of ${result.item.name}`}></image-slot>
          </div>
          <div>
            <div style={{fontSize:11,color:'var(--text-muted)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{result.item.line}</div>
            <div style={{fontSize:16,fontWeight:600}}>{result.item.name}</div>
          </div>
        </div>
        <Timeline stage={result.stage}/>
      </div>
    </section>}
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
