<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Order — The FunX Universe</title>
<meta name="description" content="Track your FunX Universe order using your order number and the email you checked out with.">
<link rel="canonical" href="https://funxuniverse.com/track-order.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The FunX Universe">
<meta property="og:title" content="Track Order — The FunX Universe">
<meta property="og:description" content="Track your FunX Universe order using your order number and the email you checked out with.">
<meta property="og:url" content="https://funxuniverse.com/track-order.html">
<meta property="og:image" content="https://funxuniverse.com/assets/hero-universe.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Track Order — The FunX Universe">
<meta name="twitter:description" content="Track your FunX Universe order using your order number and the email you checked out with.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Input, Button } = window.FunXDesignSystem_bbd8ae;

const STATUS_LABEL = { pending:'Order confirmed', processing:'In production', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };

function OrderResult({ result }){
  if (result === 'unavailable') return <div style={{border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,textAlign:'center'}}>
    <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>Order tracking isn't available right now</div>
    <p style={{color:'var(--text-secondary)',fontSize:14,lineHeight:1.6,margin:0}}>Something went wrong looking that up — please try again shortly, or sign in to your account to see your order history.</p>
    <a href="account.html" style={{display:'inline-block',marginTop:20,fontSize:14,fontWeight:600,color:'var(--text-link)'}}>Go to your account →</a>
  </div>;
  if (result === 'not-found') return <div style={{border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,textAlign:'center'}}>
    <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>No order found</div>
    <p style={{color:'var(--text-secondary)',fontSize:14,lineHeight:1.6,margin:0}}>We couldn't find an order matching that order number and email. Double-check both and try again.</p>
  </div>;
  return <div style={{border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
      <div style={{fontSize:15,fontWeight:700}}>Order {result.order_number}</div>
      <div style={{fontSize:13,fontWeight:600,color:'var(--paint-orange)'}}>{STATUS_LABEL[result.status] || result.status}</div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:16}}>
      {result.items.map((it,i) => <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--text-secondary)'}}>
        <span>{window.titleCase(it.product_name)} × {it.qty}</span>
        <span>{window.fmtPrice(it.line_total)}</span>
      </div>)}
    </div>
    {result.tracking_number && <div style={{fontSize:13,color:'var(--text-secondary)',borderTop:'1px solid var(--border-hairline)',paddingTop:14,marginBottom:6}}>{result.courier || 'Courier'} tracking: <strong style={{color:'var(--text-primary)'}}>{result.tracking_number}</strong></div>}
    <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:16,borderTop:'1px solid var(--border-hairline)',paddingTop:14,marginTop:result.tracking_number?0:14}}><span>Total</span><span>{window.fmtPrice(result.total)}</span></div>
  </div>;
}

function App(){
  const [order,setOrder] = React.useState('');
  const [email,setEmail] = React.useState('');
  const [result,setResult] = React.useState(null);
  const [loading,setLoading] = React.useState(false);

  const submit = (e) => {
    e.preventDefault();
    setLoading(true);
    setResult(null);
    window.supabaseClient.rpc('lookup_order', { p_order_number: order.trim(), p_contact_email: email.trim() })
      .then(({ data, error }) => {
        setLoading(false);
        if (error) { setResult('unavailable'); return; }
        setResult(data || 'not-found');
      });
  };

  return <div>
    <Header active=""/>
    <section style={{maxWidth:760,margin:'0 auto',padding:'72px 40px 0',textAlign:'center'}} data-screen-label="Track Order">
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:48,margin:'0 0 14px'}}>Track Your Order</h1>
      <p style={{color:'var(--text-secondary)',fontSize:16}}>Enter your order number and email to see production and shipping status. Works whether you checked out signed in or as a guest.</p>
    </section>

    <section style={{maxWidth:520,margin:'0 auto',padding:'40px 40px 0'}}>
      <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:20,border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)',padding:32,background:'var(--surface-panel)'}}>
        <Input label="Order number" placeholder="FX-10482" value={order} onChange={e=>setOrder(e.target.value)} required/>
        <Input label="Email" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required/>
        <Button variant="primary" size="lg" disabled={loading}>{loading ? 'Looking up…' : 'Track Order'}</Button>
      </form>
    </section>

    {result && <section style={{maxWidth:520,margin:'0 auto',padding:'40px 40px 96px'}}>
      <OrderResult result={result}/>
    </section>}
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
