<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trending — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tokens/theme-light.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas,#0b0b0d)"><svg width="32" height="32" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#F16A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s" repeatCount="indefinite"/></circle></svg></div></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
function RankedRow({ p, rank }){
  const [hover,setHover] = React.useState(false);
  return <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{display:'grid',gridTemplateColumns:'64px 96px 1fr auto',alignItems:'center',gap:24,padding:'20px 8px',borderBottom:'1px solid var(--border-hairline-soft)',background:hover?'var(--surface-panel)':'transparent',borderRadius:12,transition:'background var(--duration-fast)'}}>
    <div style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:32,color:'var(--text-muted-soft)'}}>{String(rank).padStart(2,'0')}</div>
    <div style={{width:96,height:96,borderRadius:'var(--radius-md)',overflow:'hidden',background:'var(--surface-gallery)',border:'1px solid var(--border-gallery)'}}>
      <image-slot id={`rank-${p.id}`} style={{width:'100%',height:'100%'}} placeholder={`Photo of ${p.name}`}></image-slot>
    </div>
    <div>
      <div style={{fontSize:11,color:'var(--text-muted)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{p.line}</div>
      <div style={{fontSize:18,fontWeight:600}}>{p.name}</div>
      <div style={{fontSize:13,color:'var(--text-muted)',marginTop:4}}>{p.reviews} collectors this month</div>
    </div>
    <div style={{fontSize:18,fontWeight:700,color:'var(--paint-orange)'}}>{window.fmtPrice(p.salePrice||p.price)}</div>
  </div>;
}

function App(){
  const list = [...window.PRODUCTS].filter(p=>p.isTrending).sort((a,b)=>b.reviews-a.reviews);
  return <div>
    <Header active="Trending"/>
    <section style={{position:'relative',height:340,display:'flex',alignItems:'center',overflow:'hidden'}} data-screen-label="Trending">
      <div style={{position:'absolute',inset:0}}><image-slot id="hero-trending" placeholder="Photo — collector's shelf of best-selling die-cast pieces"></image-slot></div>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,rgba(11,11,13,0.9) 10%,rgba(11,11,13,0.35) 100%)'}}></div>
      <div style={{position:'relative',maxWidth:1280,margin:'0 auto',padding:'0 40px',width:'100%'}}>
        <div style={{fontSize:12,letterSpacing:2,fontWeight:700,color:'var(--accent-cyan)',textTransform:'uppercase',marginBottom:14}}>Most Collected</div>
        <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:60,margin:0}}>Trending Now</h1>
      </div>
    </section>
    <section style={{maxWidth:960,margin:'0 auto',padding:'64px 40px 96px'}}>
      {list.map((p,i) => <RankedRow key={p.id} p={p} rank={i+1}/>)}
    </section>
    <PromoBanner title="See What Collectors Are Chasing" sub="Rankings update weekly based on Collector's Circle activity." cta="Join the Circle" ctaHref="account.html"/>
    <Footer/>
  </div>;
}
window.PRODUCTS_PROMISE.then(() => ReactDOM.render(<App/>, document.getElementById('root')));
</script>
<script src="motion.js"></script>
</body></html>
