<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Wishlist — The FunX Universe</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="image-slot.js"></script>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel">
const { Button } = window.FunXDesignSystem_bbd8ae;

function WishRow({ p, onRemove }){
  return <div style={{display:'grid',gridTemplateColumns:'96px 1fr auto auto',alignItems:'center',gap:24,padding:'20px 8px',borderBottom:'1px solid var(--border-hairline-soft)'}}>
    <div style={{width:96,height:96,borderRadius:'var(--radius-md)',overflow:'hidden',background:'var(--surface-gallery)',border:'1px solid var(--border-gallery)'}}>
      <image-slot id={`wish-${p.id}`} style={{width:'100%',height:'100%'}} placeholder={`Photo of ${p.name}`}></image-slot>
    </div>
    <div>
      <div style={{fontSize:11,color:'var(--text-muted)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{p.line}</div>
      <div style={{fontSize:18,fontWeight:600,marginBottom:6}}>{p.name}</div>
      <div style={{fontSize:15,fontWeight:700,color:'var(--paint-orange)'}}>{window.fmtPrice(p.salePrice||p.price)}</div>
    </div>
    <Button variant="secondary" size="sm" onClick={()=>location.href='cart.html'}>Move to Cart</Button>
    <span onClick={()=>onRemove(p.id)} style={{cursor:'pointer',color:'var(--text-muted)',width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'50%'}} title="Remove">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </span>
  </div>;
}

function App(){
  const [ids,setIds] = React.useState(['p1','p5','p8','p12','p18','p23']);
  const items = window.PRODUCTS.filter(p => ids.includes(p.id));
  return <div>
    <Header active=""/>
    <section style={{maxWidth:960,margin:'0 auto',padding:'72px 40px 24px',textAlign:'center'}} data-screen-label="Wishlist">
      <h1 style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:800,fontSize:48,margin:'0 0 12px'}}>Your Wishlist</h1>
      <p style={{color:'var(--text-secondary)',fontSize:16}}>{items.length} piece{items.length===1?'':'s'} saved for later.</p>
    </section>
    <section style={{maxWidth:960,margin:'0 auto',padding:'40px 40px 96px'}}>
      {items.length === 0 ? <div style={{textAlign:'center',padding:'64px 0'}}>
        <p style={{color:'var(--text-muted)',fontSize:15,marginBottom:24}}>Nothing here yet — tap the heart on any piece to save it.</p>
        <Button variant="primary" size="lg" onClick={()=>location.href='toys-plush.html'}>Browse Toys & Plush</Button>
      </div> : <>
        {items.map(p => <WishRow key={p.id} p={p} onRemove={(id)=>setIds(v=>v.filter(x=>x!==id))}/>)}
        <div style={{textAlign:'center',marginTop:40}}>
          <Button variant="primary" size="lg" onClick={()=>location.href='cart.html'}>Move All to Cart</Button>
        </div>
      </>}
    </section>
    <Footer/>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body></html>
